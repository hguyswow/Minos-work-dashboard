<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>작업 현황</title>
<script>
/* WD-15: FOUC 방지 - DOM 렌더링 전 저장된 테마 즉시 적용 */
(function(){
  try {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch(e) {}
})();
</script>
<style>
/* ========================================================
   WD-15: 테마 토큰 팔레트 (파일 상단 한 곳에 정의)
   - 라이트: 정갈한 슬레이트 + 절제된 모던 블루 포인트 + 부드러운 구분선
   - 다크: 눈부심 낮은 짙은 슬레이트 + 맑은 스카이 블루 포인트 + 고대비(WCAG AA 4.5:1 이상)
   ======================================================== */
:root, :root[data-theme="light"] {
  --theme: light;
  --bg: #f8fafc;
  --card: #ffffff;
  --card-sub: #f1f5f9;
  --ink: #0f172a;
  --sub: #475569;         /* 슬레이트 600: 흰색(#ffffff) 대비 7.0:1 */
  --line: #e2e8f0;        /* 부드러운 구분선 */
  --strong: #94a3b8;      /* 기둥 및 주요 구역 구분선 */
  --accent: #2563eb;      /* 절제된 모던 로열 블루 */
  --accent-hover: #1d4ed8;
  --accent-faint: #eff6ff;
  --head: #f1f5f9;        /* 구역 제목 줄 은은한 배경 */
  --th-bg: #f8fafc;       /* 표 머리글 배경 */
  --row-line: #f1f5f9;    /* 표 행 구분선 */
  --slot-bg: #f8fafc;     /* 날씨 슬롯 배경 */
  --slot-border: #e2e8f0;
  --slot-now-bg: #eff6ff;
  --slot-now-border: #2563eb;
  --danger: #dc2626;
  --warn-bg: #fef2f2;
  --warn-border: #fecaca;
  --warn-text: #991b1b;
  --banner-bg: #fffbeb;
  --banner-text: #92400e;
  --banner-border: #fef3c7;
  --btn-bg: #ffffff;
  --btn-hover: #f1f5f9;
  --input-bg: #ffffff;
  --input-text: #0f172a;
  --input-border: #cbd5e1;
  --draft-bar-bg: #0f172a;
  --draft-bar-ink: #ffffff;
  --overlay-bg: rgba(15, 23, 42, 0.45);
  --modal-bg: #ffffff;
  --modal-ink: #0f172a;
  --modal-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  --tv-btn-bg: rgba(15, 23, 42, 0.85);
  --conn-bg: rgba(255, 255, 255, 0.92);
  --sec-work: #1d4ed8;
  --sec-equip: #c2410c;
  --sec-crew: #047857;
  --sec-material: #6d28d9;
  --sec-notes: #be123c;
}

:root[data-theme="dark"] {
  --theme: dark;
  --bg: #0b0f17;          /* 짙은 슬레이트 950 */
  --card: #151e2e;        /* 카드 배경 (슬레이트 900 계열) */
  --card-sub: #1e293b;
  --ink: #f1f5f9;         /* 밝은 본문 텍스트 (명도비 13.5:1) */
  --sub: #94a3b8;         /* 슬레이트 400 (명도비 5.3:1) */
  --line: #263345;        /* 다크 구분선 */
  --strong: #3b4d66;      /* 다크 강한 구분선 */
  --accent: #38bdf8;      /* 다크에서 선명한 스카이 블루 (명도비 6.1:1) */
  --accent-hover: #60a5fa;
  --accent-faint: #17283c;
  --head: #1c2738;        /* 구역 제목 줄 */
  --th-bg: #182333;       /* 표 머리글 배경 */
  --row-line: #1e293b;    /* 표 행 구분선 */
  --slot-bg: #182333;     /* 날씨 슬롯 배경 */
  --slot-border: #263345;
  --slot-now-bg: #17283c;
  --slot-now-border: #38bdf8;
  --danger: #f87171;
  --warn-bg: #37171a;
  --warn-border: #6b2126;
  --warn-text: #fca5a5;
  --banner-bg: #271e0c;
  --banner-text: #fde047;
  --banner-border: #4a3610;
  --btn-bg: #1c2738;
  --btn-hover: #26354c;
  --input-bg: #0e1520;
  --input-text: #f1f5f9;
  --input-border: #2e3e54;
  --draft-bar-bg: #1c2738;
  --draft-bar-ink: #f1f5f9;
  --overlay-bg: rgba(0, 0, 0, 0.72);
  --modal-bg: #151e2e;
  --modal-ink: #f1f5f9;
  --modal-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  --tv-btn-bg: rgba(28, 39, 56, 0.9);
  --conn-bg: rgba(21, 30, 46, 0.92);
  --sec-work: #38bdf8;
  --sec-equip: #fb923c;
  --sec-crew: #34d399;
  --sec-material: #a78bfa;
  --sec-notes: #fb7185;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    --theme: dark;
    --bg: #0b0f17;
    --card: #151e2e;
    --card-sub: #1e293b;
    --ink: #f1f5f9;
    --sub: #94a3b8;
    --line: #263345;
    --strong: #3b4d66;
    --accent: #38bdf8;
    --accent-hover: #60a5fa;
    --accent-faint: #17283c;
    --head: #1c2738;
    --th-bg: #182333;
    --row-line: #1e293b;
    --slot-bg: #182333;
    --slot-border: #263345;
    --slot-now-bg: #17283c;
    --slot-now-border: #38bdf8;
    --danger: #f87171;
    --warn-bg: #37171a;
    --warn-border: #6b2126;
    --warn-text: #fca5a5;
    --banner-bg: #271e0c;
    --banner-text: #fde047;
    --banner-border: #4a3610;
    --btn-bg: #1c2738;
    --btn-hover: #26354c;
    --input-bg: #0e1520;
    --input-text: #f1f5f9;
    --input-border: #2e3e54;
    --draft-bar-bg: #1c2738;
    --draft-bar-ink: #f1f5f9;
    --overlay-bg: rgba(0, 0, 0, 0.72);
    --modal-bg: #151e2e;
    --modal-ink: #f1f5f9;
    --modal-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    --tv-btn-bg: rgba(28, 39, 56, 0.9);
    --conn-bg: rgba(21, 30, 46, 0.92);
    --sec-work: #38bdf8;
    --sec-equip: #fb923c;
    --sec-crew: #34d399;
    --sec-material: #a78bfa;
    --sec-notes: #fb7185;
  }
}

*{box-sizing:border-box}
html{font-size:clamp(14px,1.05vw,42px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;min-height:100vh;padding-bottom:3.2rem}

header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:1rem;padding:.15rem 1.2rem;background:var(--card);border-bottom:3px solid var(--strong);min-height:2.4rem}
#clock-weather{display:flex;align-items:center;gap:.8rem;justify-self:start;flex:none}
#clock{display:flex;flex-direction:column;font-variant-numeric:tabular-nums;line-height:1.05;flex:none}
#clock #date{font-size:.65rem;color:var(--sub)}
#clock #time{font-size:1.6rem;font-weight:700;color:var(--ink);letter-spacing:-.02em}

/* 날씨 띠 */
#weather{display:grid;grid-template-areas:"head summary" "bar bar";gap:.04rem;font-size:.6rem;color:var(--sub)}
#weather:empty{display:none}
.w-head{grid-area:head;display:flex;align-items:center;gap:.3rem;font-size:.6rem;line-height:1.1}
.w-head .w-place{font-weight:700;color:var(--ink)}
.w-head .w-tag{color:var(--sub);font-size:.58rem}
.w-head .w-guide{color:var(--accent);font-size:.58rem;cursor:pointer}
.w-summary{grid-area:summary;font-size:.6rem;color:var(--danger);font-weight:700;line-height:1.1;margin:0;text-align:right}
.w-bar{grid-area:bar;display:flex;gap:.2rem;align-items:stretch}
.w-slot{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;column-gap:.12rem;row-gap:.02rem;padding:.06rem .2rem;background:var(--slot-bg);border:1px solid var(--slot-border);border-radius:.25rem;font-size:.6rem;min-width:2.2rem;text-align:center;font-variant-numeric:tabular-nums;line-height:1.05}
.w-slot[data-wx="clear"]{background:#fefce8;border-color:#fef08a}
.w-slot[data-wx="cloud"]{background:#f1f5f9;border-color:#e2e8f0}
.w-slot[data-wx="fog"]{background:#f8fafc;border-color:#e2e8f0}
.w-slot[data-wx="rain"]{background:#eff6ff;border-color:#bfdbfe}
.w-slot[data-wx="snow"]{background:#f0fdfa;border-color:#99f6e4}
.w-slot[data-wx="thunder"]{background:#faf5ff;border-color:#e9d5ff}
:root[data-theme="dark"] .w-slot[data-wx="clear"]{background:#252210;border-color:#4a3f12}
:root[data-theme="dark"] .w-slot[data-wx="cloud"]{background:#182232;border-color:#283950}
:root[data-theme="dark"] .w-slot[data-wx="fog"]{background:#18202c;border-color:#273548}
:root[data-theme="dark"] .w-slot[data-wx="rain"]{background:#13233a;border-color:#1e3a60}
:root[data-theme="dark"] .w-slot[data-wx="snow"]{background:#12282a;border-color:#1a4548}
:root[data-theme="dark"] .w-slot[data-wx="thunder"]{background:#221a34;border-color:#3d2c5e}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]) .w-slot[data-wx="clear"]{background:#252210;border-color:#4a3f12}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .w-slot[data-wx="cloud"]{background:#182232;border-color:#283950}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .w-slot[data-wx="fog"]{background:#18202c;border-color:#273548}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .w-slot[data-wx="rain"]{background:#13233a;border-color:#1e3a60}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .w-slot[data-wx="snow"]{background:#12282a;border-color:#1a4548}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .w-slot[data-wx="thunder"]{background:#221a34;border-color:#3d2c5e}
}
.w-slot.now{border:2px solid var(--slot-now-border) !important;background:var(--slot-now-bg) !important;font-weight:700}
.w-slot.warn{background:var(--warn-bg) !important;border-color:var(--warn-border) !important;color:var(--warn-text) !important;font-weight:700}
.w-slot .w-h{grid-column:1 / -1;font-size:.6rem;color:var(--sub);font-weight:600}
.w-slot.now .w-h{color:var(--accent);font-weight:700}
.w-slot .w-icon{font-size:.78rem;line-height:1}
.w-slot .w-temp{font-size:.68rem;font-weight:700;color:var(--ink);line-height:1}
.w-slot .w-temp.t-cold{color:#2563eb}
:root[data-theme="dark"] .w-slot .w-temp.t-cold{color:#60a5fa}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]) .w-slot .w-temp.t-cold{color:#60a5fa}
}
.w-slot .w-temp.t-hot{color:#dc2626}
:root[data-theme="dark"] .w-slot .w-temp.t-hot{color:#f87171}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]) .w-slot .w-temp.t-hot{color:#f87171}
}
.w-slot.warn .w-temp{color:var(--warn-text) !important}
.w-slot .w-wind{font-size:.58rem;font-weight:600;color:var(--sub);line-height:1}
.w-slot.warn .w-wind{color:var(--warn-text);font-weight:700}
.w-slot .w-rain{font-size:.58rem;color:var(--accent);font-weight:700;line-height:1}
.w-slot:not(:has(.w-rain)) .w-wind{grid-column:1 / -1}

#header-title{text-align:center;font-size:1.85rem;font-weight:700;letter-spacing:.12em;line-height:1.15;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#header-title .site-name{color:var(--accent);margin-right:.6rem;font-weight:800}

#right{justify-self:end;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:flex-end;flex:none}
#status{font-size:.85rem;color:var(--sub)}#status.err{color:var(--danger);font-weight:700}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--btn-bg);border-radius:.4rem;padding:.25rem .7rem;font-size:.9rem;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{background:var(--btn-hover);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.faint{opacity:.85}.btn.faint:hover{opacity:1}
.btn.active{font-weight:700;color:var(--accent);border-color:var(--accent);background:var(--accent-faint);opacity:1}
.nav-group{display:inline-flex;gap:.35rem;align-items:center}

/* WD-10: 모니터용(/tv) 우상단 컨트롤 바 (전체화면 + 테마 전환 버튼) */
#tv-controls{position:fixed;top:.65rem;right:.85rem;z-index:9999;display:flex;gap:.4rem;align-items:center;opacity:0;pointer-events:none;transition:opacity .25s ease-in-out;user-select:none}
#tv-controls.is-visible{opacity:1;pointer-events:auto}
#tv-fullscreen-btn, #tv-theme-btn, #tv-edit-btn{background:var(--tv-btn-bg);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:.4rem;padding:.32rem .75rem;font-size:.82rem;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);display:flex;align-items:center;gap:.35rem;user-select:none}
#tv-fullscreen-btn:hover, #tv-theme-btn:hover, #tv-edit-btn:hover{background:rgba(30,41,59,.98);border-color:#fff}
#tv-status{background:var(--tv-btn-bg);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.3);border-radius:.4rem;padding:.32rem .65rem;font-size:.75rem;box-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap}
#tv-status.stale{background:#b91c1c;color:#fff;font-weight:700;border-color:#fff}
.cell.qty-missing{color:var(--sub);opacity:.55;font-size:.8em}
.badge.meal-badge.clickable{cursor:pointer;text-decoration:underline dotted}
.meal-detail{width:100%;border-collapse:collapse;font-size:.95rem}
.meal-detail td{padding:.3rem .5rem;border-bottom:1px solid var(--line)}
.meal-detail td:last-child{text-align:right;font-weight:600}
.meal-detail tr.total td{border-top:2px solid var(--strong);font-weight:700}
.copy-prev-list{display:flex;flex-direction:column;gap:.45rem;margin:.4rem 0}
.copy-prev-list label{display:flex;gap:.5rem;align-items:center;cursor:pointer}
.print-val{display:none !important}
@media print{
  body, body.tv{height:auto !important;min-height:0 !important;overflow:visible !important;background:#fff !important;color:#000 !important}
  header{background:#fff !important;color:#000 !important;border-bottom:1px solid #111 !important;display:grid !important;grid-template-columns:1fr auto 1fr !important;align-items:center !important}
  header::after{content:"" !important;display:block !important}
  #clock #time,#clock #date,#header-title,#header-title .site-name{color:#000 !important}
  #header-title{max-width:none !important;overflow:visible !important;text-overflow:clip !important;white-space:normal !important;font-size:1.5rem !important;text-align:center !important}
  #right,#banner,#weather,#tv-controls,#conn-info,.tools,.toast,.ov,.btn,button,#datalists,.acts,.sec-resize-handle{display:none !important}
  .sec-page.is-hidden,.work-page.is-hidden,.sec-col-page.is-hidden{display:block !important}
  .sec-page,.sec-col-page{height:auto !important;overflow:visible !important}
  main{display:grid !important;grid-template-columns:1fr 1fr !important;height:auto !important;overflow:visible !important;align-items:stretch !important;border:1px solid #111 !important;box-sizing:border-box !important}
  main.view-single{grid-template-columns:1fr !important}
  .col{height:100% !important;background:transparent !important;box-sizing:border-box !important;border:none !important}
  .col + .col{border-left:1px solid #111 !important}
  main.view-single .col{border-left:none !important}
  .col,.sec,.sec-body{break-inside:avoid;overflow:visible !important;height:auto !important;max-height:none !important}
  .sec{border-bottom:1px solid #999 !important;background:transparent !important}
  .col > .sec:last-child{border-bottom:none !important}
  main .sec-inner-col + .sec-inner-col{border-left:1px solid #999 !important;padding-left:.3rem !important}
  .sec-h{background:#f1f5f9 !important;border-bottom:1px solid #ccc !important;border-left:none !important;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;font-weight:700 !important;color:#000 !important}
  .sec-body{background:transparent !important}
  main input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]),main select,main textarea{display:none !important}
  input,select,textarea{border:none !important;background:transparent !important;box-shadow:none !important;outline:none !important;outline-width:0 !important;-webkit-appearance:none !important;appearance:none !important;padding:0 !important;font:inherit !important;color:#000 !important}
  ::placeholder{color:transparent !important}
  input[style*="outline"],input.qty{outline:none !important;outline-width:0 !important}
  .print-val{display:inline-block !important;white-space:normal !important;overflow:visible !important;text-overflow:clip !important;overflow-wrap:anywhere !important;word-break:keep-all !important;color:#000 !important;font:inherit !important;line-height:1.25 !important}
  main .cols-inner-2 .grid-crew-v > .cell,main .cols-inner-3 .grid-crew-v > .cell,main .cols-inner-2 .grid-equip-v > .cell,main .cols-inner-3 .grid-equip-v > .cell,main .cols-inner-2 .grid-material-v > .cell,main .cols-inner-3 .grid-material-v > .cell,main .cols-inner-2 .grid-notes-v > .cell,main .cols-inner-3 .grid-notes-v > .cell,main .cols-inner-2 .grid-work-v > .cell,main .cols-inner-3 .grid-work-v > .cell,main .sec-group .grid-crew-v > .cell,main .sec-group .grid-equip-v > .cell,main .tbl-row > .cell,main .tbl-row > div,.cell,.work-val,.work-tree{white-space:normal !important;overflow:visible !important;text-overflow:clip !important;overflow-wrap:anywhere !important;word-break:keep-all !important}
  .cols-inner-3 .print-val,.cols-inner-3 .cell,.cols-inner-3 .tbl-row > div{font-size:.9em !important}
  .tbl-h.grid-work-e > div:last-child,.tbl-h.grid-equip-e > div:last-child,.tbl-h.grid-crew-e > div:last-child,.tbl-h.grid-material-e > div:last-child,.tbl-h.grid-notes-e > div:last-child{display:none !important}
  .grid-work-e{grid-template-columns:3.2rem 1fr !important}
  .grid-equip-e{grid-template-columns:2.5rem 1.4fr 4.5rem 1.2fr 1.4fr !important}
  .grid-crew-e{grid-template-columns:2.5rem 1.5fr 1fr 1.3fr !important}
  .grid-material-e{grid-template-columns:2.5rem 1.4fr 1.3fr 0.9fr 0.7fr 1.5fr !important}
  .grid-notes-e{grid-template-columns:2.5rem 1fr !important}
  .btn-direct:not(.on){display:none !important}
  .btn-direct.on{display:inline !important;border:none !important;background:transparent !important;color:#000 !important;text-decoration:underline !important;padding:0 !important;font:inherit !important;font-size:inherit !important}
  .badge.meal-badge{border:1px solid #999 !important;background:transparent !important;color:#000 !important;text-decoration:none !important}
}


/* WD-19: 어제/오늘/어제+오늘 보기 모드 세그먼트 버튼 & 단일 칸 1fr 레이아웃 */
.view-mode-control{display:inline-flex;align-items:center;background:var(--card-sub);border:1px solid var(--line);border-radius:.4rem;padding:2px;gap:2px}
.view-mode-control .btn-view{border:none;background:transparent;color:var(--sub);font-size:.8rem;font-weight:500;padding:.2rem .55rem;border-radius:.3rem;cursor:pointer;transition:all .15s ease;line-height:1.2;white-space:nowrap}
.view-mode-control .btn-view:hover{color:var(--ink)}
.view-mode-control .btn-view.active{background:var(--card);color:var(--accent);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
#tv-controls .view-mode-control{background:var(--tv-btn-bg);border:1px solid rgba(255,255,255,.3);box-shadow:0 2px 8px rgba(0,0,0,.35)}
#tv-controls .view-mode-control .btn-view{color:rgba(255,255,255,.75)}
#tv-controls .view-mode-control .btn-view:hover{color:#fff}
#tv-controls .view-mode-control .btn-view.active{background:rgba(255,255,255,.25);color:#fff}

main.view-single,
body.tv:not(.admin) main.view-single,
body:not(.tv) main.view-single{grid-template-columns:1fr !important}

#banner{display:none;background:var(--banner-bg);color:var(--banner-text);text-align:center;padding:.25rem;font-size:.9rem;border-bottom:1px solid var(--banner-border)}
body.admin #banner{display:block}
#banner.warn{display:block;background:var(--warn-bg);color:var(--warn-text);border-bottom:1px solid var(--warn-border);font-weight:700}

main{display:grid;grid-template-columns:1fr 1fr;align-items:start}
.col{background:var(--card);min-height:60vh}
.col+.col{border-left:3px double var(--strong)}
.colhead{text-align:center;font-weight:700;font-size:1.3rem;padding:.55rem;border-bottom:3px double var(--strong)}
.colhead small{font-weight:400;color:var(--sub);margin-left:.6rem;font-size:.9rem}
.empty{color:var(--sub);text-align:center;padding:2rem}

.sec{border-bottom:2px solid var(--strong)}
.sec-h{background:var(--head);font-weight:700;padding:.25rem .7rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.sec-h .badge{font-size:.85rem;font-weight:600;color:var(--accent);margin-left:.4rem}
.sec-h .badge.work-page-badge,.sec-h .badge.page-badge{color:var(--sub);font-weight:500}
.sec-page.is-hidden,.work-page.is-hidden{display:none !important}

/* WD-20: 5개 패널 타이틀 색상 분리 */
.sec-work .sec-h > span:first-child { color: var(--sec-work); }
.sec-equip .sec-h > span:first-child { color: var(--sec-equip); }
.sec-crew .sec-h > span:first-child { color: var(--sec-crew); }
.sec-material .sec-h > span:first-child { color: var(--sec-material); }
.sec-notes .sec-h > span:first-child { color: var(--sec-notes); }

/* WD-43: 섹션별 헤더 포인트 바 및 배경 색상 틴트 (10% 헤더, 2.5% 본문) */
.sec-work .sec-h { background: color-mix(in srgb, var(--sec-work) 10%, var(--head)); border-left: 4px solid var(--sec-work); }
.sec-equip .sec-h { background: color-mix(in srgb, var(--sec-equip) 10%, var(--head)); border-left: 4px solid var(--sec-equip); }
.sec-crew .sec-h { background: color-mix(in srgb, var(--sec-crew) 10%, var(--head)); border-left: 4px solid var(--sec-crew); }
.sec-material .sec-h { background: color-mix(in srgb, var(--sec-material) 10%, var(--head)); border-left: 4px solid var(--sec-material); }
.sec-notes .sec-h { background: color-mix(in srgb, var(--sec-notes) 10%, var(--head)); border-left: 4px solid var(--sec-notes); }

.sec-work .sec-body { background: color-mix(in srgb, var(--sec-work) 2.5%, var(--card)); }
.sec-equip .sec-body { background: color-mix(in srgb, var(--sec-equip) 2.5%, var(--card)); }
.sec-crew .sec-body { background: color-mix(in srgb, var(--sec-crew) 2.5%, var(--card)); }
.sec-material .sec-body { background: color-mix(in srgb, var(--sec-material) 2.5%, var(--card)); }
.sec-notes .sec-body { background: color-mix(in srgb, var(--sec-notes) 2.5%, var(--card)); }

/* WD-20: 직영 항목 밑줄, 범례, 관리자 체크박스, 식수인원 배지 */
.cell.is-direct {
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1.5px;
}
.legend-direct {
  font-size: .75rem;
  font-weight: 500;
  color: var(--sub);
  margin-left: .45rem;
  opacity: .9;
}
.btn-direct {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: .75rem;
  line-height: 1.2;
  font-weight: 500;
  padding: .1rem .42rem;
  border-radius: .3rem;
  border: 1px solid var(--line);
  background: var(--card-sub);
  color: var(--sub);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  box-sizing: border-box;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.btn-direct:not([aria-pressed="true"]):hover {
  background: var(--line);
  color: var(--ink);
}
.btn-direct[aria-pressed="true"],
.btn-direct.on {
  background: var(--accent);
  border-color: var(--accent);
  color: #ffffff;
  font-weight: 700;
}
.btn-direct[aria-pressed="true"]:hover,
.btn-direct.on:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}
.btn-direct:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
:root[data-theme="dark"] .btn-direct[aria-pressed="true"],
:root[data-theme="dark"] .btn-direct.on {
  color: #0b0f17;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) .btn-direct[aria-pressed="true"],
  :root:not([data-theme="light"]):not([data-theme="dark"]) .btn-direct.on {
    color: #0b0f17;
  }
}
.badge.meal-badge {
  background: var(--accent-faint);
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: .3rem;
  padding: .05rem .35rem;
  font-size: .82rem;
  font-weight: 600;
  white-space: nowrap;
}

/* WD-24: 다열 입력창 접두 라벨, 순서 변경 스피너 및 드래그앤드롭 */
.fld {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  min-width: 0;
}
.fld input {
  width: 100%;
  min-width: 0;
}
.fld-l {
  display: none;
  position: absolute;
  left: .35rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: .68rem;
  color: var(--sub);
  pointer-events: none;
  white-space: nowrap;
  max-width: 45%;
  overflow: hidden;
  text-overflow: ellipsis;
  user-select: none;
  line-height: 1;
  z-index: 2;
}
.fld-l::after {
  content: ':';
  margin-left: 1px;
  margin-right: 2px;
}
.is-narrow .fld-l,
.cols-inner-2 .fld-l,
.cols-inner-3 .fld-l,
.sec-group.cols-3 .fld-l {
  display: inline-flex;
}
.is-narrow .fld input,
.cols-inner-2 .fld input,
.cols-inner-3 .fld input,
.sec-group.cols-3 .fld input {
  padding-left: calc(var(--fld-w, 2.1rem) + .25rem);
}
.fld.name { --fld-w: 2.35rem; }
.fld.kind, .fld.spec, .fld.loc, .fld.job, .fld.count, .fld.qty, .fld.unit, .fld.use { --fld-w: 1.85rem; }

/* 순서 변경 스피너 화살표 버튼 (WD-24) */
.btn-spin {
  display: inline-flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 1px;
  flex: none;
}
.ib-mini {
  border: 1px solid var(--line);
  background: var(--btn-bg);
  color: var(--ink);
  border-radius: .2rem;
  padding: 0;
  width: 17px;
  height: 12px;
  font-size: .52rem;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
}
.ib-mini:hover {
  background: var(--btn-hover);
  border-color: var(--accent);
  color: var(--accent);
}
.ib-mini[disabled] {
  opacity: .2;
  cursor: default;
  pointer-events: none;
}

/* 드래그앤드롭 행 표시 (WD-24) */
body.admin .tbl-row .num {
  cursor: grab;
  user-select: none;
  transition: background .12s, color .12s;
}
body.admin .tbl-row .num:hover {
  background: var(--card-sub);
  color: var(--accent);
  border-radius: .25rem;
}
body.admin .tbl-row .num:active {
  cursor: grabbing;
}
.tbl-row.is-dragging {
  opacity: .35;
  background: var(--card-sub) !important;
}
.tbl-row.drag-over-above {
  border-top: 2px solid var(--accent) !important;
}
.tbl-row.drag-over-below {
  border-bottom: 2px solid var(--accent) !important;
}
.tools{display:flex;gap:.35rem;align-items:center}
.inner-cols-ctl{display:inline-flex;align-items:center;gap:.25rem;font-size:.8rem;color:var(--sub);font-weight:500;cursor:pointer}
.inner-cols-ctl:hover{color:var(--ink)}
.inner-cols-select{font-size:.8rem;padding:.12rem .3rem;border:1px solid var(--input-border);border-radius:.25rem;background:var(--input-bg);color:var(--input-text);cursor:pointer;line-height:1.2}
.inner-cols-select:focus{outline:2px solid var(--accent);border-color:var(--accent)}

/* 테이블 레이아웃 - 머리글은 데이터와 같은 왼쪽 정렬 (번호 열만 가운데) */
.tbl-h{display:grid;gap:.35rem;padding:.25rem .6rem;background:var(--th-bg);font-size:.85rem;color:var(--sub);font-weight:700;border-bottom:1px solid var(--line);text-align:left}
.tbl-h .num{text-align:center}
.tbl-row{display:grid;gap:.35rem;padding:.22rem .6rem;border-bottom:1px solid var(--row-line);align-items:center;font-size:.95rem;text-align:left}
.tbl-row .num{text-align:center;color:var(--sub);font-variant-numeric:tabular-nums;font-weight:700}
.tbl-row .cell{word-break:break-all}
.tbl-row input{width:100%;font:inherit;padding:.2rem .4rem;border:1px solid var(--input-border);background:var(--input-bg);color:var(--input-text);border-radius:.3rem;min-width:0}
.tbl-row input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.br{color:var(--sub)}
.none{color:var(--sub);padding:.3rem .7rem}

/* 그리드 컬럼 설정 */
.grid-work-v{grid-template-columns:3.2rem 1fr}
.grid-work-e{grid-template-columns:3.2rem 1fr auto}
.grid-equip-v{grid-template-columns:2.5rem 1.4fr 4rem 1.2fr 1.4fr}
.grid-equip-e{grid-template-columns:2.5rem 1.4fr 4.5rem 1.2fr 1.4fr auto}
.grid-crew-v{grid-template-columns:2.5rem 1.5fr 1fr 1.3fr}
.grid-crew-e{grid-template-columns:2.5rem 1.5fr 1fr 1.3fr auto}
.grid-material-v{grid-template-columns:2.5rem 1.4fr 1.3fr 0.9fr 0.7fr 1.5fr}
.grid-material-e{grid-template-columns:2.5rem 1.4fr 1.3fr 0.9fr 0.7fr 1.5fr auto}
.grid-notes-v{grid-template-columns:2.5rem 1fr}
.grid-notes-e{grid-template-columns:2.5rem 1fr auto}

/* 구역 배치 및 내부 다단 (WD-9) */
.col{background:var(--card);min-height:60vh;display:grid;grid-template-columns:repeat(var(--col-cols, 1), minmax(0, 1fr));align-content:start}
.colhead{grid-column:1 / -1}
.sec.is-full{grid-column:1 / -1}
.sec.is-narrow{grid-column:span 1;border-right:1px solid var(--line)}
body:not(.admin) .col > .sec:last-child{border-bottom:none}

.sec-page{width:100%}
.sec-page.cols-inner-1{display:block}
.sec-page.cols-inner-2{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;height:100%}
.sec-page.cols-inner-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.3rem;height:100%}
.sec-inner-grid{width:100%;height:100%}
.sec-inner-grid.cols-inner-1{display:block}
.sec-inner-grid.cols-inner-2{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.sec-inner-grid.cols-inner-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.3rem}
.sec-inner-col{min-width:0;display:flex;flex-direction:column;overflow:hidden;height:100%;container-type:inline-size}
.sec-inner-col+.sec-inner-col{border-left:1px dashed var(--line);padding-left:.3rem}
.sec-col-page{min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden}
.sec-col-page.is-hidden{display:none !important}
.sec-edit-grid.cols-inner-1{display:block}
.sec-edit-grid.cols-inner-2{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.sec-edit-grid.cols-inner-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.3rem}
.inner-cols-limit{font-size:.72rem;color:var(--danger);font-weight:600;margin-left:.15rem;white-space:nowrap}

#layout-draft-bar{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--draft-bar-bg);color:var(--draft-bar-ink);padding:.45rem 1rem;border-radius:.5rem;box-shadow:0 4px 14px rgba(0,0,0,.35);border:1px solid var(--line);display:flex;align-items:center;gap:.75rem;z-index:70;font-size:.86rem;font-weight:500;animation:slideUp .2s ease-out}
#layout-draft-bar .msg{display:flex;align-items:center;gap:.35rem}
#layout-draft-bar .btn-save{background:var(--accent);color:#fff;border:none;padding:.28rem .75rem;border-radius:.35rem;font-weight:600;cursor:pointer}
#layout-draft-bar .btn-save:hover{background:var(--accent-hover)}
#layout-draft-bar .btn-revert{background:var(--card-sub);color:var(--ink);border:1px solid var(--line);padding:.28rem .75rem;border-radius:.35rem;cursor:pointer}
#layout-draft-bar .btn-revert:hover{background:var(--line)}
#layout-draft-bar.saved{background:#059669;color:#fff}

/* 하위 호환 sec-group 유지 (기존 CSS 방어) */
.sec-group{display:contents}

@media(min-width:801px){
  /* WD-10: 모니터용(/tv) 데스크톱 고정 레이아웃 */
  body.tv:not(.admin){height:100vh;height:100dvh;overflow:hidden;padding-bottom:0;display:flex;flex-direction:column}
  body.tv:not(.admin) header{flex:none}
  body.tv:not(.admin) #banner{flex:none}
  body.tv:not(.admin) main{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;align-items:stretch}
  body.tv:not(.admin) .col{height:100%;min-height:0;display:grid;grid-template-columns:repeat(var(--col-cols, 1), minmax(0, 1fr));align-content:start;overflow:hidden}
  body.tv:not(.admin) .colhead{flex:none;padding:.32rem;grid-column:1 / -1}
  body.tv:not(.admin) .sec{min-height:0;display:flex;flex-direction:column;overflow:hidden;flex:none}
  body.tv:not(.admin) .sec.is-empty{flex:none !important}
  body.tv:not(.admin) .sec-h,body.tv:not(.admin) .tbl-h{flex:none}
  body.tv:not(.admin) .sec-h{padding:.14rem .7rem}
  body.tv:not(.admin) .tbl-h{padding:.12rem .6rem}
  body.tv:not(.admin) .tbl-row{padding:.11rem .6rem}
  body.tv:not(.admin) .sec-body{flex:1;min-height:0;overflow:hidden;position:relative}

  /* WD-10: 사용자용(/) 일반 문서 흐름 레이아웃 */
  body:not(.tv){min-height:100vh;overflow-y:auto;display:block;padding-bottom:3.2rem}
  body:not(.tv) main{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  body:not(.tv) .col{min-height:60vh;display:grid;grid-template-columns:repeat(var(--col-cols, 1), minmax(0, 1fr));align-content:start}
  body:not(.tv) .sec{display:block;overflow:visible;height:auto !important;flex:none}
  body:not(.tv) .sec-body{overflow:visible;height:auto !important}
  body:not(.tv) .sec-page{display:block !important;height:auto !important}

  /* 좁은 칸 또는 다단 내부 2단 컴팩트 서브 그리드 (장비) */
  .is-narrow .grid-equip-v,
  .cols-inner-2 .grid-equip-v,
  .cols-inner-3 .grid-equip-v,
  .sec-group.cols-3 .grid-equip-v{grid-template-columns:2.2rem 1.4fr 1.1fr;grid-template-rows:auto auto;gap:.25rem .35rem}
  .is-narrow .grid-equip-v>.num,
  .cols-inner-2 .grid-equip-v>.num,
  .cols-inner-3 .grid-equip-v>.num,
  .sec-group.cols-3 .grid-equip-v>.num{grid-row:1 / 3;grid-column:1}
  .is-narrow .grid-equip-v>.cell:nth-child(2),
  .cols-inner-2 .grid-equip-v>.cell:nth-child(2),
  .cols-inner-3 .grid-equip-v>.cell:nth-child(2),
  .sec-group.cols-3 .grid-equip-v>.cell:nth-child(2){grid-row:1;grid-column:2;font-weight:700;color:var(--ink)}
  .is-narrow .grid-equip-v>.cell:nth-child(3),
  .cols-inner-2 .grid-equip-v>.cell:nth-child(3),
  .cols-inner-3 .grid-equip-v>.cell:nth-child(3),
  .sec-group.cols-3 .grid-equip-v>.cell:nth-child(3){grid-row:1;grid-column:3;color:var(--sub);font-size:.88em}
  .is-narrow .grid-equip-v>.cell:nth-child(4),
  .cols-inner-2 .grid-equip-v>.cell:nth-child(4),
  .cols-inner-3 .grid-equip-v>.cell:nth-child(4),
  .sec-group.cols-3 .grid-equip-v>.cell:nth-child(4){grid-row:2;grid-column:2;color:var(--sub);font-size:.88em}
  .is-narrow .grid-equip-v>.cell:nth-child(5),
  .cols-inner-2 .grid-equip-v>.cell:nth-child(5),
  .cols-inner-3 .grid-equip-v>.cell:nth-child(5),
  .sec-group.cols-3 .grid-equip-v>.cell:nth-child(5){grid-row:2;grid-column:3;color:var(--sub);font-size:.88em}

  .is-narrow .grid-equip-e,
  .cols-inner-2 .grid-equip-e,
  .cols-inner-3 .grid-equip-e,
  .sec-group.cols-3 .grid-equip-e{grid-template-columns:2.2rem 1.2fr 1fr auto;grid-template-rows:auto auto;gap:.25rem .3rem}
  .is-narrow .grid-equip-e>.num,
  .cols-inner-2 .grid-equip-e>.num,
  .cols-inner-3 .grid-equip-e>.num,
  .sec-group.cols-3 .grid-equip-e>.num{grid-row:1 / 3;grid-column:1}
  .is-narrow .grid-equip-e>.name,
  .cols-inner-2 .grid-equip-e>.name,
  .cols-inner-3 .grid-equip-e>.name,
  .sec-group.cols-3 .grid-equip-e>.name{grid-row:1;grid-column:2}
  .is-narrow .grid-equip-e>.qty,
  .cols-inner-2 .grid-equip-e>.qty,
  .cols-inner-3 .grid-equip-e>.qty,
  .sec-group.cols-3 .grid-equip-e>.qty{grid-row:1;grid-column:3}
  .is-narrow .grid-equip-e>.spec,
  .cols-inner-2 .grid-equip-e>.spec,
  .cols-inner-3 .grid-equip-e>.spec,
  .sec-group.cols-3 .grid-equip-e>.spec{grid-row:2;grid-column:2}
  .is-narrow .grid-equip-e>.loc,
  .cols-inner-2 .grid-equip-e>.loc,
  .cols-inner-3 .grid-equip-e>.loc,
  .sec-group.cols-3 .grid-equip-e>.loc{grid-row:2;grid-column:3}
  .is-narrow .grid-equip-e>.acts,
  .cols-inner-2 .grid-equip-e>.acts,
  .cols-inner-3 .grid-equip-e>.acts,
  .sec-group.cols-3 .grid-equip-e>.acts{grid-row:1 / 3;grid-column:4}

  .is-narrow .tbl-h.grid-equip-v,
  .cols-inner-2 .tbl-h.grid-equip-v,
  .cols-inner-3 .tbl-h.grid-equip-v,
  .sec-group.cols-3 .tbl-h.grid-equip-v{grid-template-columns:2.2rem 1.4fr 1.1fr;grid-template-rows:auto auto;gap:.15rem .35rem}
  .is-narrow .tbl-h.grid-equip-v>div:nth-child(1),
  .cols-inner-2 .tbl-h.grid-equip-v>div:nth-child(1),
  .cols-inner-3 .tbl-h.grid-equip-v>div:nth-child(1),
  .sec-group.cols-3 .tbl-h.grid-equip-v>div:nth-child(1){grid-row:1 / 3;grid-column:1}
  .is-narrow .tbl-h.grid-equip-v>div:nth-child(2),
  .cols-inner-2 .tbl-h.grid-equip-v>div:nth-child(2),
  .cols-inner-3 .tbl-h.grid-equip-v>div:nth-child(2),
  .sec-group.cols-3 .tbl-h.grid-equip-v>div:nth-child(2){grid-row:1;grid-column:2}
  .is-narrow .tbl-h.grid-equip-v>div:nth-child(3),
  .cols-inner-2 .tbl-h.grid-equip-v>div:nth-child(3),
  .cols-inner-3 .tbl-h.grid-equip-v>div:nth-child(3),
  .sec-group.cols-3 .tbl-h.grid-equip-v>div:nth-child(3){grid-row:1;grid-column:3}
  .is-narrow .tbl-h.grid-equip-v>div:nth-child(4),
  .cols-inner-2 .tbl-h.grid-equip-v>div:nth-child(4),
  .cols-inner-3 .tbl-h.grid-equip-v>div:nth-child(4),
  .sec-group.cols-3 .tbl-h.grid-equip-v>div:nth-child(4){grid-row:2;grid-column:2;font-size:.85em}
  .is-narrow .tbl-h.grid-equip-v>div:nth-child(5),
  .cols-inner-2 .tbl-h.grid-equip-v>div:nth-child(5),
  .cols-inner-3 .tbl-h.grid-equip-v>div:nth-child(5),
  .sec-group.cols-3 .tbl-h.grid-equip-v>div:nth-child(5){grid-row:2;grid-column:3;font-size:.85em}

  /* WD-25: 2열 이상 다단(컴팩트) 편집 머리글 - 머리글 줄 전체 숨김 */
  .is-narrow .tbl-h.grid-equip-e,

.acts{display:flex;gap:.15rem}
.ib{border:1px solid var(--line);background:var(--btn-bg);color:var(--ink);border-radius:.3rem;padding:.1rem .4rem;font-size:.85rem;line-height:1.3}
.ib:hover{background:var(--btn-hover);border-color:var(--accent)}.ib.del:hover{background:var(--warn-bg);border-color:var(--danger);color:var(--danger)}
.ib[disabled]{opacity:.3;cursor:default}

.ov{position:fixed;inset:0;background:var(--overlay-bg);display:flex;align-items:center;justify-content:center;z-index:50}
.md{background:var(--modal-bg);color:var(--modal-ink);border:1px solid var(--line);border-radius:.7rem;padding:1.1rem;width:min(30rem,92vw);max-height:85vh;display:flex;flex-direction:column;gap:.7rem;box-shadow:var(--modal-shadow)}
.md.wide{width:min(44rem,95vw)}
.md h2{margin:0;font-size:1.15rem}
.md .body-scroll{overflow-y:auto;display:flex;flex-direction:column;gap:.8rem;padding-right:.3rem}
.md input[type=text],.md input[type=password],.md select{font:inherit;padding:.4rem .6rem;background:var(--input-bg);color:var(--input-text);border:1px solid var(--input-border);border-radius:.4rem}
.md .form-row{display:flex;flex-direction:column;gap:.3rem}
.md .form-row label{font-size:.85rem;font-weight:700;color:var(--sub)}
.md .hint{font-size:.78rem;color:var(--sub)}
.md .geo-results{display:flex;flex-direction:column;gap:.25rem;max-height:8rem;overflow-y:auto;border:1px solid var(--line);border-radius:.35rem;padding:.3rem}
.md .geo-item{text-align:left;background:var(--th-bg);border:1px solid var(--line);color:var(--ink);border-radius:.25rem;padding:.3rem .5rem;cursor:pointer}
.md .geo-item:hover{background:var(--accent-faint);border-color:var(--accent)}
.md .table-manual{width:100%;border-collapse:collapse;font-size:.85rem}
.md .table-manual th,.md .table-manual td{padding:.3rem .4rem;border:1px solid var(--line);text-align:center}
.md .table-manual th{background:var(--th-bg);color:var(--sub);font-size:.8rem}
.md .table-manual input,.md .table-manual select{width:100%;font:inherit;padding:.2rem .3rem;background:var(--input-bg);color:var(--input-text);border:1px solid var(--input-border)}
.md .btns{display:flex;gap:.4rem;justify-content:flex-end;margin-top:.4rem}
.msg{color:var(--danger);font-size:.88rem;min-height:1.1em}

/* WD-22: 월별 계획 및 공고 스타일 */
.md.wide-plans {
  width: min(58rem, 96vw);
  max-height: 90vh;
}
.plans-layout {
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: 1rem;
  min-height: 22rem;
}
@media (max-width: 768px) {
  .plans-layout { grid-template-columns: 1fr; }
}
.cal-wrap {
  display: flex;
  flex-direction: column;
  gap: .5rem;
  border-right: 1px solid var(--line);
  padding-right: .8rem;
}
@media (max-width: 768px) {
  .cal-wrap { border-right: none; padding-right: 0; border-bottom: 1px solid var(--line); padding-bottom: .8rem; }
}
.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
}
.cal-nav .btn-nav {
  background: var(--btn-bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: .35rem;
  padding: .2rem .6rem;
  cursor: pointer;
  font-weight: 700;
}
.cal-nav .btn-nav:hover {
  background: var(--btn-hover);
  border-color: var(--accent);
}
.cal-nav-title {
  font-size: 1.05rem;
  font-weight: 700;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;

<main id="main"></main>
<div id="conn-info">접속 주소 확인 중…</div>
<div id="brand-footer"><a href="/guide.html" target="_blank" rel="noopener noreferrer" class="brand-guide" title="프로그램 상세 가이드" aria-label="프로그램 상세 가이드"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></a><div class="brand-text"><span class="brand-name">Minos work dashboard</span><br><span class="brand-contact">문의: hguyswow@gmail.com</span></div></div>
<div id="toast"></div>

<script>
'use strict';
const TV_MODE = location.pathname.startsWith('/tv');
if (TV_MODE) document.body.classList.add('tv');
const CATS = [
  { key: 'work', label: '작업현황' },
  { key: 'equip', label: '장비' },
  { key: 'crew', label: '인원투입' },
  { key: 'material', label: '자재' },
  { key: 'notes', label: '특이사항' },
];
const MAX_DEPTH = 4;
const S = {
  today: null,
  prev: null,
  days: {},
  settings: { siteName: '', place: null, windLimit: 10, rainLimit: 1, equipCols: 1 },
  weather: null,
  suggest: {},
  token: null,
  admin: false,
  authExpired: false,
  focusId: null,
  focusCol: null,
  modalOpen: false,
  layoutDraft: null,
  layoutSavedNotice: false,
  heightsDraft: null,
};
let activeInlineEdit = null;
let pendingRenderAfterInline = false;

// ---------- WD-15: 테마 관리 (라이트 / 다크 / 자동) ----------
function getThemeMode() {
  try {
    const saved = localStorage.getItem('theme');
    if (saved === 'light' || saved === 'dark') return saved;
  } catch (e) {}
  return 'auto';
}

function applyTheme(mode) {
  if (mode === 'light' || mode === 'dark') {
    document.documentElement.setAttribute('data-theme', mode);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
}

function cycleThemeMode() {
  const cur = getThemeMode();
  const next = (cur === 'auto') ? 'light' : (cur === 'light') ? 'dark' : 'auto';
  try {
    if (next === 'auto') {
      localStorage.removeItem('theme');
    } else {
      localStorage.setItem('theme', next);
    }
  } catch (e) {}
  applyTheme(next);
  document.querySelectorAll('#theme-toggle-btn, #tv-theme-btn').forEach((btn) => {
    if (btn._updateTheme) btn._updateTheme();
  });
  return next;
}

function createThemeToggleBtn(isTv = false) {
  const btn = el('button', {
    id: isTv ? 'tv-theme-btn' : 'theme-toggle-btn',
    class: isTv ? '' : 'btn faint',
    type: 'button',
  });
  const update = () => {
    const mode = getThemeMode();
    if (mode === 'light') {
      btn.textContent = '☀ 라이트';
      btn.title = '테마: 라이트 (클릭 시 다크 모드로 전환)';
    } else if (mode === 'dark') {
      btn.textContent = '🌙 다크';
      btn.title = '테마: 다크 (클릭 시 자동 모드로 전환)';
    } else {
      btn.textContent = '💻 자동';
      btn.title = '테마: 자동(시스템 설정 따름, 클릭 시 라이트 모드로 전환)';
    }
  };
  btn.onclick = () => {
    cycleThemeMode();
  };
  btn._updateTheme = update;
  update();
  return btn;
}

// ---------- WD-19: 보기 모드 관리 (어제 / 오늘 / 어제+오늘) ----------
const VIEW_MODES = [
  { key: 'yesterday', label: '어제' },
  { key: 'both', label: '어제+오늘' },
  { key: 'today', label: '오늘' },
];

function getViewMode() {
  const params = new URLSearchParams(window.location.search);
  const urlView = params.get('view');
  if (urlView === 'today' || urlView === 'yesterday' || urlView === 'both') return urlView;
  try {
    const stored = localStorage.getItem('view_mode');
    if (stored === 'today' || stored === 'yesterday' || stored === 'both') return stored;
  } catch (e) {}
  return 'both';
}

function setViewMode(mode) {
  if (mode !== 'today' && mode !== 'yesterday' && mode !== 'both') return;
  try {
    localStorage.setItem('view_mode', mode);
  } catch (e) {}
  updateViewModeControls();
  render();
}

function updateViewModeControls() {
  document.querySelectorAll('.view-mode-control').forEach((ctl) => {
    if (ctl._updateViewMode) ctl._updateViewMode();
  });
}

function createViewModeControl(isTv = false) {
  const ctl = el('div', { class: 'view-mode-control' + (isTv ? ' tv' : '') });
  const buttons = {};

  VIEW_MODES.forEach((m) => {
    const btn = el('button', {
      type: 'button',
      class: 'btn-view',
      text: m.label,
      title: `보기: ${m.label}`,
    });
    btn.onclick = (e) => {
      e.preventDefault();
      setViewMode(m.key);
    };
    buttons[m.key] = btn;
    ctl.appendChild(btn);
  });

  const update = () => {
    const current = getViewMode();
    VIEW_MODES.forEach((m) => {
      const btn = buttons[m.key];
      if (btn) {
        btn.classList.toggle('active', m.key === current);
      }
    });
  };

  ctl._updateViewMode = update;
  update();
  return ctl;
}

function getLayout() {
  const raw = S.settings && S.settings.layout;
  const fallbackCols = [1, 2, 3].includes(Number(S.settings && S.settings.equipCols)) ? Number(S.settings.equipCols) : 1;
  const cols = (raw && [1, 2, 3].includes(Number(raw.cols))) ? Number(raw.cols) : fallbackCols;
  const validKeys = ['work', 'equip', 'crew', 'material', 'notes'];
  let order = Array.isArray(raw && raw.order) ? raw.order.filter((k) => validKeys.includes(k)) : [];
  if (order.length !== 5 || new Set(order).size !== 5) {
    order = ['work', 'equip', 'crew', 'material', 'notes'];
  }
  const full = {};
  const inner = {};
  const heights = {};
  for (const k of validKeys) {
    if (raw && raw.full && typeof raw.full[k] === 'boolean') {
      full[k] = raw.full[k];
    } else {
      full[k] = (k === 'work' || k === 'notes' || cols === 1 || (cols === 2 && k === 'material'));
    }
    if (raw && raw.inner && [0, 1, 2, 3].includes(Number(raw.inner[k]))) {
      inner[k] = Number(raw.inner[k]);
    } else {
      inner[k] = 1;
    }
    const draftH = (S.heightsDraft && S.heightsDraft[k] !== undefined) ? S.heightsDraft[k] : undefined;
    const v = (draftH !== undefined) ? draftH : (raw && raw.heights && raw.heights[k]);
    if (typeof v === 'number' && Number.isFinite(v) && v >= 5 && v <= 90) {
      heights[k] = Math.round(v);
    } else {
      heights[k] = null;
    }
  }
  return { cols, order, full, inner, heights };
}

let dragSource = null;

function setupRowDnd(row, numEl, list, i, dk, redoFn) {
  numEl.title = '드래그하여 순서 변경';
  numEl.addEventListener('mousedown', () => row.setAttribute('draggable', 'true'));
  numEl.addEventListener('mouseup', () => row.removeAttribute('draggable'));

  row.addEventListener('dragstart', (e) => {
    dragSource = { list, index: i, dk, redoFn, id: list[i] ? list[i].id : null };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(i));
    requestAnimationFrame(() => row.classList.add('is-dragging'));
  });

  row.addEventListener('dragend', () => {
    row.removeAttribute('draggable');
    row.classList.remove('is-dragging');
    document.querySelectorAll('.drag-over-above, .drag-over-below').forEach((el) => {
      el.classList.remove('drag-over-above', 'drag-over-below');
    });
    dragSource = null;
  });

  row.addEventListener('dragover', (e) => {
    if (!dragSource || dragSource.list !== list) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const rect = row.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    if (e.clientY < mid) {
      row.classList.add('drag-over-above');
      row.classList.remove('drag-over-below');
    } else {
      row.classList.add('drag-over-below');
      row.classList.remove('drag-over-above');
    }
  });

  row.addEventListener('dragleave', () => {
    row.classList.remove('drag-over-above', 'drag-over-below');
  });

  row.addEventListener('drop', (e) => {
    if (!dragSource || dragSource.list !== list) return;
    e.preventDefault();
    const fromIdx = dragSource.index;
    let toIdx = i;
    const rect = row.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    const placeAfter = e.clientY >= mid;

    row.classList.remove('drag-over-above', 'drag-over-below');

    if (placeAfter && fromIdx > toIdx) toIdx++;
    else if (!placeAfter && fromIdx < toIdx) toIdx--;

    if (fromIdx === toIdx) return;

    const [item] = list.splice(fromIdx, 1);
    list.splice(toIdx, 0, item);
    S.focusId = item.id;
    touch(dk);
    if (redoFn) redoFn();
    else render();
  });
}

async function api(url, opt = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (!TV_MODE && S.token) headers.Authorization = 'Bearer ' + S.token;
  const r = await fetch(url, { ...opt, headers });
  if (r.status === 401 && !TV_MODE && S.token && url !== '/api/login') {
    onAuthExpired();
    throw new Error('auth');
  }
  if (!r.ok) throw Object.assign(new Error(r.status), { status: r.status, body: await r.json().catch(() => ({})) });
  return r.json();
}

function renderWeatherBar() {
  const container = $('#weather');
  if (!container) return;
  const w = S.weather;
  if (!w || w.source === 'none' || !w.slots || !w.slots.length) {
    if (w && w.source === 'none') {
      container.replaceChildren();
      const meta = el('div', { class: 'w-head' },
        el('span', { class: 'w-tag', text: '날씨 정보 없음' }),
        ...(S.admin ? [el('span', { class: 'w-guide', text: '· 설정에서 위치 지정 또는 수동 입력', onclick: openSettingsModal })] : [])
      );
      container.append(meta);
    } else {
      container.replaceChildren();
    }
    fitHeaderTitle();
    return;
  }

  container.replaceChildren();

  // 상단 헤더: 위치/출처/갱신시각
  const meta = el('div', { class: 'w-head' });
  const placeName = (w.place && w.place.name) || (S.settings.place && S.settings.place.name) || '';
  if (placeName) {
    meta.append(el('span', { class: 'w-place', text: placeName }));
  }
  if (w.source === 'manual') {
    meta.append(el('span', { class: 'w-tag', text: '(수동 입력)' }));
  } else if (w.source === 'auto' && w.updated) {
    const d = new Date(w.updated);
    const timeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    meta.append(el('span', { class: 'w-tag', text: `갱신 ${timeStr}` }));
  }
  container.append(meta);

  // 8칸 슬롯 바
  const currentHour = new Date().getHours();
  // 현재 시각이 속한 칸: h <= currentHour 중 가장 큰 h (단, currentHour < 6 이면 강조 없음)
  let activeHour = -1;
  if (currentHour >= 6) {
    const validHours = w.slots.map((s) => s.h).filter((h) => h <= currentHour);
    if (validHours.length) activeHour = Math.max(...validHours);
  }

  const getWxType = (icon) => {
    if (!icon) return 'clear';
    if (icon.includes('⛈')) return 'thunder';
    if (icon.includes('❄')) return 'snow';
    if (icon.includes('🌧') || icon.includes('🌦')) return 'rain';
    if (icon.includes('🌫')) return 'fog';
    if (icon.includes('☁')) return 'cloud';
    return 'clear';
  };

  const bar = el('div', { class: 'w-bar' });
  for (const s of w.slots) {
    const isNow = (s.h === activeHour);
    const hasWarn = Array.isArray(s.warn) && s.warn.length > 0;
    const wxType = getWxType(s.icon);
    const tVal = Math.round(s.temp);
    let tempClass = 'w-temp';
    if (tVal <= 5) tempClass += ' t-cold';
    else if (tVal >= 28) tempClass += ' t-hot';

    const slotEl = el('div', {
      class: 'w-slot' + (isNow ? ' now' : '') + (hasWarn ? ' warn' : ''),
      'data-wx': wxType,
    },
      el('div', { class: 'w-h', text: `${s.h}시` }),
      el('div', { class: 'w-icon', text: s.icon || '☀️' }),
      el('div', { class: tempClass, text: `${tVal}°` }),
      el('div', { class: 'w-wind', text: `${s.wind}m/s` }),
      ...(s.rain > 0 ? [el('div', { class: 'w-rain', text: `${s.rain}mm` })] : [])
    );
    bar.append(slotEl);
  }
  container.append(bar);

  // 하단 경고 요약 (비어있으면 줄 자체를 두지 않음)
  if (w.warnSummary && w.warnSummary.trim()) {
    container.append(el('div', { class: 'w-summary', text: w.warnSummary }));
  }
  fitHeaderTitle();
}

const timers = {};
const dirty = {};
const lastSavedHash = {};
const saveSeq = {};
const retryTimers = {};

function setStatus(t, err) {
  const s = $('#status');
  if (s) {
    s.textContent = t;
    s.className = err ? 'err' : '';
  }

function touch(dk) {
  dirty[dk] = true;
  setStatus('저장 대기…');
  clearTimeout(timers[dk]);
  clearTimeout(retryTimers[dk]);
  timers[dk] = setTimeout(() => saveDay(dk), 500);
}

async function saveDay(dk) {
  if (!S.token) {
    if (S.authExpired) setStatus('로그인이 만료되었습니다. 이 화면을 새로고침하지 말고 다시 로그인하세요.', true);
    return false;
  }
  const seq = (++saveSeq[dk] || (saveSeq[dk] = 1));
  const payload = JSON.stringify(S.days[dk] || emptyDay());
  if (lastSavedHash[dk] === payload && !dirty[dk]) {
    setStatus('저장됨 ✓ ' + new Date().toLocaleTimeString('ko-KR'));
    return true;
  }
  setStatus('저장 중…');
  clearTimeout(retryTimers[dk]);
  try {
    await api('/api/day/' + dk, { method: 'PUT', body: payload });
    if (seq === saveSeq[dk]) {
      lastSavedHash[dk] = payload;
      delete dirty[dk];
      setStatus('저장됨 ✓ ' + new Date().toLocaleTimeString('ko-KR'));
    }
    return true;
  } catch (e) {
    if (e.message === 'auth') return false;
    if (seq === saveSeq[dk]) {
      setStatus('저장 실패 ✗ (3초 후 재시도)', true);
      clearTimeout(retryTimers[dk]);
      retryTimers[dk] = setTimeout(() => {
        if (dirty[dk] || lastSavedHash[dk] !== JSON.stringify(S.days[dk] || emptyDay())) {
          saveDay(dk);
        }
      }, 3000);
    }
    return false;
  }
}

function fitHeaderTitle() {
  const titleEl = $('#header-title');
  if (!titleEl) return;
  if (window.innerWidth <= 800) {
    if (titleEl.style.maxWidth !== '100%') titleEl.style.maxWidth = '100%';
    return;
  }
  const clockEl = $('#clock');
  const weatherEl = $('#weather');
  const cwEl = $('#clock-weather');
  let leftEdge = cwEl ? cwEl.getBoundingClientRect().right : 0;
  if (clockEl) leftEdge = Math.max(leftEdge, clockEl.getBoundingClientRect().right);
  if (weatherEl) {
    leftEdge = Math.max(leftEdge, weatherEl.getBoundingClientRect().right);
    const lastChild = weatherEl.lastElementChild;
    if (lastChild) leftEdge = Math.max(leftEdge, lastChild.getBoundingClientRect().right);
    const lastSlot = weatherEl.querySelector('.w-slot:last-child');
    if (lastSlot) leftEdge = Math.max(leftEdge, lastSlot.getBoundingClientRect().right);
  }

  const rightEl = $('#right');
  let rightEdge = rightEl ? rightEl.getBoundingClientRect().left : window.innerWidth;
  if (rightEl && rightEl.children.length > 0) {
    const firstChild = rightEl.firstElementChild;
    if (firstChild) rightEdge = Math.min(rightEdge, firstChild.getBoundingClientRect().left);
  }

  const center = window.innerWidth / 2;
  const avail = 2 * Math.min(center - leftEdge, rightEdge - center) - 16;
  const nextVal = Math.max(0, Math.floor(avail)) + 'px';
  if (titleEl.style.maxWidth !== nextVal) titleEl.style.maxWidth = nextVal;
}

      );
    } else if (S.admin) {
      r.append(
        el('span', { id: 'status', text: '' }),
        navGroup,
        themeBtn,
        el('button', { class: 'btn faint', text: '지난 날짜', onclick: openHistoryModal }),
        el('button', { class: 'btn', text: '어제 내용 → 오늘 복사', onclick: copyPrev }),
        el('button', { class: 'btn', text: '출력', title: '일일 보고용 인쇄 / PDF 저장', onclick: printReport }),
        el('button', { class: 'btn', text: '월별계획', onclick: openPlansModal }),
        el('button', { class: 'btn', text: '설정', onclick: openSettingsModal }),
        el('button', { class: 'btn', text: '로그아웃', onclick: logout })
      );
    } else {
      r.append(navGroup, viewControl, themeBtn, el('button', { class: 'btn faint', text: '지난 날짜', onclick: openHistoryModal }), el('button', { class: 'btn faint', text: '출력', title: '일일 보고용 인쇄 / PDF 저장', onclick: printReport }), el('button', { class: 'btn faint', text: '관리자', onclick: openLogin }));
    }
  }

  const viewMode = getViewMode();
  const showSingle = !S.admin && (viewMode === 'yesterday' || viewMode === 'today');
  const mainEl = $('#main');
  mainEl.classList.toggle('view-single', showSingle);

  if (S.admin || viewMode === 'both') {
    mainEl.replaceChildren(col('어제', S.prev), col('오늘', S.today));
  } else if (viewMode === 'yesterday') {
    mainEl.replaceChildren(col('어제', S.prev));
  } else if (viewMode === 'today') {
    mainEl.replaceChildren(col('오늘', S.today));
  }

  if (!S.admin && window.innerWidth > 800) {
    requestAnimationFrame(() => {
      layoutAndPaginateAll();
      requestAnimationFrame(() => {
        layoutAndPaginateAll();
      });
    });
  }

  if (S.focusId) {
    const sel = S.focusCol ? `[data-id="${S.focusId}"] input.${S.focusCol}` : `[data-id="${S.focusId}"] input`;
    const target = document.querySelector(sel);
    if (target) target.focus();
    S.focusId = null;
    S.focusCol = null;
  }
  renderLayoutDraftBar();
}

function workNum(depth, n) {
  if (depth === 0) return String(n);
  if (depth === 1) {
    if (n >= 1 && n <= 20) return String.fromCharCode(0x2460 + n - 1);
    if (n >= 21 && n <= 35) return String.fromCharCode(0x3251 + n - 21);
    if (n >= 36 && n <= 50) return String.fromCharCode(0x32B1 + n - 36);
    return `(${n})`;
  }
  const hangulCircles = '㉮㉯㉰㉱㉲㉳㉴㉵㉶㉷㉸㉹㉺㉻';
  if (n >= 1 && n <= hangulCircles.length) return hangulCircles[n - 1];
  return `(${n})`;
}

function col(label, dk) {
  const currentLayout = getLayout();
  // 관리자 편집 중에는 넉넉한 입력칸을 위해 1열 강제(WD-3/WD-9 원칙), order 순서는 편집 화면에 그대로 반영
  const layout = S.admin ? {
    cols: 1,
    order: currentLayout.order,
    full: { work: true, equip: true, crew: true, material: true, notes: true },
    inner: { ...currentLayout.inner, ...(S.layoutDraft || {}) },
  } : currentLayout;

  const w = el('section', { class: 'col', style: `--col-cols:${layout.cols}` },
    el('div', { class: 'colhead' }, label, el('small', { text: dk ? fmt(dk) : '' }))
  );
  if (!dk) {
    w.append(el('div', { class: 'empty', text: '이전 기록이 없습니다' }));
    return w;
  }
  const day = S.days[dk] || emptyDay();

  const secRenderers = {
    work: () => renderWorkSec(day, dk),
    equip: () => renderEquipSec(day, dk),
    crew: () => renderCrewSec(day, dk),
    material: () => renderMaterialSec(day, dk),
    notes: () => renderNotesSec(day, dk),
  };

  for (const key of layout.order) {
    const fn = secRenderers[key];
    if (!fn) continue;
    const secEl = fn();
    const isFull = (layout.cols === 1) || !!layout.full[key];
    secEl.classList.toggle('is-full', isFull);
    secEl.classList.toggle('is-narrow', !isFull);
    secEl.dataset.key = key;
    w.append(secEl);
  }

  return w;
}

let innerColsSaving = false;
let layoutSavedTimer = null;

function getLayoutDraftDiffKeys() {
  if (!S.layoutDraft) return [];
  const curInner = getLayout().inner;
  return Object.keys(S.layoutDraft).filter((k) => S.layoutDraft[k] !== curInner[k]);
}

function getEffectiveInner(secKey) {
  if (S.layoutDraft && S.layoutDraft[secKey] !== undefined) {
    return Number(S.layoutDraft[secKey]);
  }
  const layout = getLayout();
  return (layout.inner && [0, 1, 2, 3].includes(Number(layout.inner[secKey])))
    ? Number(layout.inner[secKey])
    : 1;
}

function estimateSecWidth(secKey) {
  const layout = getLayout();
  const isFull = (layout.cols === 1) || !!layout.full[secKey];
  const screenW = window.innerWidth || 1200;
  if (isFull) return Math.max(300, screenW - 40);
  return Math.max(300, (screenW - 40) / layout.cols);
}

function getAdminEffectiveCols(secKey) {
  const rawTarget = getEffectiveInner(secKey);
  const availW = estimateSecWidth(secKey);
  const maxPossible = Math.max(1, Math.min(3, Math.floor(availW / 340)));

  if (rawTarget === 0) { // 자동
    return {
      target: 0,
      actual: maxPossible,
      isLimited: false,
      maxPossible,
    };
  }
  return {
    target: rawTarget,
    actual: Math.min(rawTarget, maxPossible),
    isLimited: rawTarget > maxPossible,
    maxPossible,
  };
}

async function saveLayoutDraft() {
  if (innerColsSaving) return;
  const diffKeys = getLayoutDraftDiffKeys();
  if (!diffKeys.length) return;

  innerColsSaving = true;
  renderLayoutDraftBar();

  const nextLayout = {
    ...getLayout(),
    inner: {
      ...getLayout().inner,
      ...S.layoutDraft,
    },
  };

  try {
    const res = await api('/api/settings', {
      method: 'PUT',
      body: JSON.stringify({ layout: nextLayout }),
    });
    if (res && res.settings) {
      S.settings = { ...S.settings, ...res.settings, layout: nextLayout };
    } else {
      S.settings = { ...S.settings, layout: nextLayout };
    }
    S.layoutDraft = null;
    S.layoutSavedNotice = true;
    clearTimeout(layoutSavedTimer);
    layoutSavedTimer = setTimeout(() => {
      S.layoutSavedNotice = false;
      renderLayoutDraftBar();
    }, 3000);
    render();
  } catch (err) {
    console.error('레이아웃 저장 실패:', err);
    toast('레이아웃 저장에 실패했습니다');
    render();
  } finally {
    innerColsSaving = false;
    renderLayoutDraftBar();
  }
}

function revertLayoutDraft() {
  S.layoutDraft = null;
  S.layoutSavedNotice = false;
  toast('레이아웃 변경이 취소되었습니다');
  render();
}

window.addEventListener('beforeunload', (e) => {
  if (getLayoutDraftDiffKeys().length > 0) {
    e.preventDefault();
    e.returnValue = '';
  }
});

function renderLayoutDraftBar() {
  let bar = document.getElementById('layout-draft-bar');
  if (!S.admin) {
    if (bar) bar.remove();
    return;
  }

  const diffKeys = getLayoutDraftDiffKeys();
  if (diffKeys.length === 0 && !S.layoutSavedNotice) {
    if (bar) bar.remove();
    return;
  }

  if (!bar) {
    bar = el('div', { id: 'layout-draft-bar' });
    document.body.appendChild(bar);
  }

  bar.replaceChildren();

  if (S.layoutSavedNotice) {
    bar.className = 'saved';
    bar.append(el('div', { class: 'msg', text: '저장됨 ✓ (조회 화면에 적용)' }));
  } else {
    bar.className = '';
    bar.append(
      el('div', { class: 'msg', text: `레이아웃 변경 ${diffKeys.length}건` }),
      el('button', {
        class: 'btn-save',
        text: innerColsSaving ? '저장 중…' : '저장',
        disabled: innerColsSaving ? '' : null,
        onclick: saveLayoutDraft,
      }),
      el('button', {
        class: 'btn-revert',
        text: '되돌리기',
        disabled: innerColsSaving ? '' : null,
        onclick: revertLayoutDraft,
      })
    );
  }
}

function renderInnerColsControl(secKey) {
  const currentVal = getEffectiveInner(secKey);
  const colInfo = getAdminEffectiveCols(secKey);

  const secNames = {
    work: '작업현황',
    equip: '장비',
    crew: '인원투입',
    material: '자재',
    notes: '특이사항',
  };

  const sel = el('select', {
    class: 'inner-cols-select',
    'aria-label': `${secNames[secKey] || secKey} 내부 열 수`,
    onchange: (e) => {
      const nextVal = parseInt(e.target.value, 10);
      if (isNaN(nextVal) || ![0, 1, 2, 3].includes(nextVal)) return;

      S.layoutDraft = {
        ...(S.layoutDraft || getLayout().inner),
        [secKey]: nextVal,
      };

      const diffKeys = getLayoutDraftDiffKeys();
      if (!diffKeys.length) {
        S.layoutDraft = null;
      }
      render();
    },
  },
    el('option', { value: '0', ...(currentVal === 0 ? { selected: '' } : {}) }, '자동'),
    el('option', { value: '1', ...(currentVal === 1 ? { selected: '' } : {}) }, '1열'),
    el('option', { value: '2', ...(currentVal === 2 ? { selected: '' } : {}) }, '2열'),
    el('option', { value: '3', ...(currentVal === 3 ? { selected: '' } : {}) }, '3열')
  );

  return el('label', {
    class: 'inner-cols-ctl',
    title: colInfo.isLimited
      ? `구역 폭이 좁아 입력칸 잘림을 방지하기 위해 ${colInfo.actual}단으로 자동 제한됩니다`
      : '조회 화면 및 편집 화면에 적용되는 내부 열 수입니다',
  },
    el('span', { class: 'inner-cols-label', text: '열' }),
    sel,
    ...(colInfo.isLimited ? [el('span', { class: 'inner-cols-limit', text: `(폭제한: ${colInfo.actual}단)` })] : [])
  );
}

// 1. 작업현황 섹션
function renderWorkSec(day, dk) {
  const h = el('div', { class: 'sec-h' }, el('span', { text: '작업현황' }));
  if (S.admin) {
    h.append(el('span', { class: 'tools' },
      renderInnerColsControl('work'),
      el('button', {
        class: 'btn primary',
        text: '＋ 추가',
        onclick: () => {
          const n = { id: uid(), t: '', c: [] };
          day.work.push(n);
          S.focusId = n.id;
          touch(dk);
          render();
        },
      })
    ));
  }
  const sec = el('div', { class: 'sec sec-work' }, h);
  if (S.admin) {
    const list = day.work;
    const colInfo = getAdminEffectiveCols('work');
    const cols = colInfo.actual;

    const renderTreeBlock = (topItem, topIdx, parentEl) => {
      const numStr = workNum(0, topIdx + 1);
      parentEl.append(editWorkRow(topItem, list, topIdx, numStr, 0, day, dk));
      const walkKids = (arr, depth) => {
        arr.forEach((kid, kIdx) => {
          const kidNum = workNum(depth, kIdx + 1);
          parentEl.append(editWorkRow(kid, arr, kIdx, kidNum, depth, day, dk));
          if (kid.c && kid.c.length) walkKids(kid.c, depth + 1);
        });
      };
      if (topItem.c && topItem.c.length) walkKids(topItem.c, 1);
    };

    if (cols <= 1 || list.length <= 1) {
      list.forEach((topItem, topIdx) => {
        renderTreeBlock(topItem, topIdx, sec);
      });
    } else {
      const gridEl = el('div', { class: `sec-edit-grid cols-inner-${cols}` });
      const perCol = Math.ceil(list.length / cols);
      for (let c = 0; c < cols; c++) {
        const colEl = el('div', { class: 'sec-inner-col' });
        const colItems = list.slice(c * perCol, (c + 1) * perCol);
        colItems.forEach((topItem, localIdx) => {
          const globalIdx = c * perCol + localIdx;
          renderTreeBlock(topItem, globalIdx, colEl);
        });
        gridEl.append(colEl);
      }
      sec.append(gridEl);
    }
  } else {
    const validTopItems = (day.work || []).filter((item) => (item.t && item.t.trim()) || hasWorkKids(item.c));
    if (!validTopItems.length) {
      sec.classList.add('is-empty');
      const secBody = el('div', { class: 'sec-body' }, el('div', { class: 'none', text: '—' }));
      sec.append(secBody);
    } else {
      const secBody = el('div', { class: 'sec-body' });
      let globalTopIdx = 0;
      const renderKids = (arr, depth, parentEl) => {
        let kIdx = 1;
        for (const item of arr) {
          const hasSelf = !!(item.t && item.t.trim());
          const hasKids = hasWorkKids(item.c);
          if (!hasSelf && !hasKids) continue;
          const numStr = workNum(depth, kIdx);
          kIdx++;
          parentEl.append(el('div', { class: 'tbl-row grid-work-v' },
            el('div', { class: 'num', text: numStr }),
            el('div', { class: 'cell t', style: `padding-left:${depth * 1.3}rem` },
              el('span', { class: 'br', text: '└ ' }),
              el('span', Object.assign({ class: 'work-val', text: item.t || '' }, cellEditAttrs(dk, 'work', item.id, 't')))
            )
          ));
          if (item.c && item.c.length) renderKids(item.c, depth + 1, parentEl);
        }
      };

      for (const item of validTopItems) {
        globalTopIdx++;
        const numStr = workNum(0, globalTopIdx);
        const blockEl = el('div', { class: 'tree-block', 'data-top-idx': String(globalTopIdx) },
          el('div', { class: 'tbl-row grid-work-v' },
            el('div', { class: 'num', text: numStr }),
            el('div', Object.assign({ class: 'cell t', text: item.t || '' }, cellEditAttrs(dk, 'work', item.id, 't')))
          )
        );
        if (item.c && item.c.length) renderKids(item.c, 1, blockEl);
        secBody.append(blockEl);
      }
      sec.append(secBody);
    }
  }
  return sec;
}

function hasWorkKids(arr) {
  if (!Array.isArray(arr)) return false;
  return arr.some((n) => (n.t && n.t.trim()) || hasWorkKids(n.c));
}

function editWorkRow(n, list, i, numStr, depth, day, dk) {
  const redo = () => { touch(dk); render(); };
  const move = (dir) => { [list[i], list[i + dir]] = [list[i + dir], list[i]]; S.focusId = n.id; redo(); };
  const suggestKey = depth === 0 ? 'work.loc' : 'work.desc';
  const listId = depth === 0 ? 'dl-work-loc' : 'dl-work-desc';

  const inputEl = el('input', {
    class: 't',
    placeholder: depth === 0 ? '위치 / 대공종' : '세부 작업 내용',
    value: n.t,
    list: listId,
    oninput: (e) => { n.t = e.target.value; touch(dk); },
    onblur: (e) => recordSuggest(suggestKey, e.target.value),
    onkeydown: (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const next = { id: uid(), t: '', c: [] };
        list.splice(i + 1, 0, next);
        S.focusId = next.id;
        redo();
      }
    },
  });

  return el('div', { class: 'tbl-row grid-work-e', 'data-id': n.id },
    el('div', { class: 'num' }, numStr),
    el('div', { style: `display:flex;align-items:center;padding-left:${depth * 1.2}rem;min-width:0;gap:.25rem` },
      ...(depth ? [el('span', { class: 'br', text: '└' })] : []),
      inputEl
    ),
    el('div', { class: 'acts' },
      el('button', {
        class: 'ib',
        title: '하위 항목 추가',
        text: '＋',
        disabled: depth >= MAX_DEPTH ? '' : null,
        onclick: () => {
          if (!n.c) n.c = [];
          const k = { id: uid(), t: '', c: [] };
          n.c.push(k);
          S.focusId = k.id;
          redo();
        },
      }),
      createMoveSpin(i, list.length, move),
      el('button', {
        class: 'ib del',
        title: '삭제',
        text: '✕',
        onclick: () => {
          if ((n.t || (n.c && n.c.length)) && !confirm('삭제할까요?' + (n.c && n.c.length ? ' (하위 항목 포함)' : ''))) return;
          list.splice(i, 1);
          redo();
        },
      })
    )
  );
}

function editEquipRow(n, list, i, num, day, sec, dk) {

// 3. 인원투입 섹션
function calcMealCount(crewList, equipList) {
  let sum = 0;
  for (const c of (crewList || [])) {
    const isEmployee = String(c.job || '').trim() === '직원';
    const isDirect = c.direct === true;
    if (isEmployee || isDirect) {
      const cnt = parseInt(String(c.count || '').trim(), 10);
      if (!isNaN(cnt) && cnt > 0) sum += cnt;
    }
  }
  for (const e of (equipList || [])) {
    if (e && e.direct === true) {
      const parsed = parseInt(String(e.qty || '').trim(), 10);
      const cnt = (!isNaN(parsed) && parsed >= 1) ? parsed : 1;
      sum += cnt;
    }
  }
  return sum;
}

function mealBreakdown(crewList, equipList) {
  const rows = [];
  for (const c of (crewList || [])) {
    const isEmployee = String(c.job || '').trim() === '직원';
    if (!(isEmployee || c.direct === true)) continue;
    const cnt = parseInt(String(c.count || '').trim(), 10);
    if (!isNaN(cnt) && cnt > 0) rows.push([`${c.job || '(직종 미입력)'}${isEmployee ? ' (직원)' : ' (직영)'}`, cnt]);
  }
  for (const e of (equipList || [])) {
    if (e && e.direct === true) {
      const parsed = parseInt(String(e.qty || '').trim(), 10);
      const cnt = (!isNaN(parsed) && parsed >= 1) ? parsed : 1;
      rows.push([`${e.name || '(장비명 미입력)'} 기사 (직영 장비)`, cnt]);
    }
  }
  return rows;
}

function openMealDetail(day) {
  const rows = mealBreakdown(day.crew, day.equip);
  const total = rows.reduce((s, r) => s + r[1], 0);
  const tbl = el('table', { class: 'meal-detail' },
    ...rows.map((r) => el('tr', {}, el('td', { text: r[0] }), el('td', { text: `${r[1]}명` }))),
    el('tr', { class: 'total' }, el('td', { text: '식수 합계' }), el('td', { text: `${total}명` }))
  );
  modal('식수 인원 상세', el('div', {},
    el('div', { class: 'hint', text: '직원 + 직영 인원 + 직영 장비 기사(수량 미기재 시 1명)' }),
    rows.length ? tbl : el('div', { class: 'empty', text: '식수 대상이 없습니다.' })
  ), []);
}

function updateCrewBadge(day, sec) {
  let total = 0;
  for (const c of (day.crew || [])) {
    const val = parseInt(String(c.count || '').trim(), 10);
    if (!isNaN(val) && val > 0) total += val;
  }
  const hasDirect = (day.crew || []).some((c) => c.direct);
  const mealCount = calcMealCount(day.crew, day.equip);
  const titleSpan = sec.querySelector('.sec-h > span');
  if (!titleSpan) return;

  let badgeEl = titleSpan.querySelector('.badge:not(.page-badge):not(.meal-badge)');
  if (total > 0) {
    if (badgeEl) {
      badgeEl.textContent = `(총 ${total}명)`;
    } else {
      titleSpan.append(el('span', { class: 'badge', text: `(총 ${total}명)` }));
    }
  } else if (badgeEl) {
    badgeEl.remove();
  }

  let legendEl = titleSpan.querySelector('.legend-direct');
  if (hasDirect) {
    if (!legendEl) {
      titleSpan.append(el('span', { class: 'legend-direct', text: '밑줄 = 직영' }));
    }
  } else if (legendEl) {
    legendEl.remove();
  }

  const secH = sec.querySelector('.sec-h');
  let mealEl = secH ? secH.querySelector('.badge.meal-badge') : null;
  if (mealCount > 0) {
    if (mealEl) {
      mealEl.textContent = `식수 ${mealCount}명`;
    } else {
      const newMeal = el('span', { class: 'badge meal-badge clickable', text: `식수 ${mealCount}명`, title: '클릭하면 계산 내역을 봅니다', onclick: () => openMealDetail(day) });
      const toolsEl = secH.querySelector('.tools');
      if (toolsEl) {
        toolsEl.prepend(newMeal);
      } else {
        secH.append(newMeal);
      }
    }
  } else if (mealEl) {
    mealEl.remove();
  }
}

// 5. 특이사항 섹션
function renderNotesSec(day, dk) {
  const h = el('div', { class: 'sec-h' }, el('span', { text: '특이사항' }));
  if (S.admin) {
    h.append(el('span', { class: 'tools' },
      renderInnerColsControl('notes'),
      el('button', {
        class: 'btn primary',
        text: '＋ 추가',
        onclick: () => {
          const n = { id: uid(), t: '' };
          day.notes.push(n);
          S.focusId = n.id;
          touch(dk);
          render();
        },
      })
    ));
  }
  const sec = el('div', { class: 'sec sec-notes' }, h);
  const headRow = el('div', { class: 'tbl-h ' + (S.admin ? 'grid-notes-e' : 'grid-notes-v') },
    el('div', { class: 'num', text: '번호' }),
    el('div', { text: '내용' }),
    ...(S.admin ? [el('div', { text: '관리' })] : [])
  );
  if (S.admin) {
    const colInfo = getAdminEffectiveCols('notes');
    const cols = colInfo.actual;
    if (cols <= 1 || day.notes.length <= 1) {
      sec.append(headRow);
      day.notes.forEach((item, idx) => {
        sec.append(editNotesRow(item, day.notes, idx, idx + 1, dk));
      });
    } else {
      const gridEl = el('div', { class: `sec-edit-grid cols-inner-${cols}` });
      const perCol = Math.ceil(day.notes.length / cols);
      for (let c = 0; c < cols; c++) {
        const colEl = el('div', { class: 'sec-inner-col' });
        colEl.append(headRow.cloneNode(true));
        const colItems = day.notes.slice(c * perCol, (c + 1) * perCol);
        colItems.forEach((item, localIdx) => {
          const globalIdx = c * perCol + localIdx;
          colEl.append(editNotesRow(item, day.notes, globalIdx, globalIdx + 1, dk));
        });
        gridEl.append(colEl);
      }
      sec.append(gridEl);
    }
  } else {
    sec.append(headRow);
    const secBody = el('div', { class: 'sec-body' });
    let count = 0;
    day.notes.forEach((item) => {
      if (!item.t || !item.t.trim()) return;
      count++;
      secBody.append(el('div', { class: 'tbl-row grid-notes-v' },
        el('div', { class: 'num', text: String(count) }),
        el('div', Object.assign({ class: 'cell', text: item.t || '' }, cellEditAttrs(dk, 'notes', item.id, 't')))
      ));
    });
    if (!count) {
      sec.classList.add('is-empty');
      secBody.append(el('div', { class: 'none', text: '—' }));
    }
    sec.append(secBody);
  }
  return sec;
}

function editNotesRow(n, list, i, num, dk) {
  const redo = () => { touch(dk); render(); };
  const move = (dir) => { [list[i], list[i + dir]] = [list[i + dir], list[i]]; S.focusId = n.id; redo(); };
  const isLast = (i === list.length - 1);

  const inputEl = el('input', {
    class: 't',
    placeholder: '특이사항 및 전달사항',
    value: n.t,
    oninput: (e) => { n.t = e.target.value; touch(dk); },
    onkeydown: (e) => {
      if (e.key === 'Enter' && isLast) {
        e.preventDefault();
        const next = { id: uid(), t: '' };
        list.push(next);
        S.focusId = next.id;
        redo();
      }
    },
  });

  const numEl = el('div', { class: 'num', text: String(num) });
  const rowEl = el('div', { class: 'tbl-row grid-notes-e', 'data-id': n.id },
    numEl,
    inputEl,
    el('div', { class: 'acts' },
      createMoveSpin(i, list.length, move),
      el('button', {
        class: 'ib del',
        title: '삭제',
        text: '✕',
        onclick: () => {
          if (n.t && !confirm('삭제할까요?')) return;
          list.splice(i, 1);
          redo();
        },
      })
    )
  );
  setupRowDnd(rowEl, numEl, list, i, dk, redo);
  return rowEl;
}

// ---------- 모달 공통 ----------
function modal(title, body, buttons, isWide = false, onBeforeClose = null) {
  S.modalOpen = true;
  const requestClose = () => {
    if (typeof onBeforeClose === 'function' && !onBeforeClose()) return;
    close();
  };
  const close = () => {
    S.modalOpen = false;
    ov.remove();
    document.removeEventListener('keydown', esc);
    render();
  };
  const esc = (e) => { if (e.key === 'Escape') requestClose(); };
  const ov = el('div', { class: 'ov', onclick: (e) => { if (e.target === ov) requestClose(); } });
  document.addEventListener('keydown', esc);
  ov.append(el('div', { class: 'md' + (isWide ? ' wide' : '') },
    el('h2', { text: title }),
    body,
    el('div', { class: 'btns' }, ...buttons, el('button', { class: 'btn', text: '닫기', onclick: requestClose }))
  ));
  document.body.append(ov);
  return close;
}

function findWorkItem(arr, targetId) {
  if (!Array.isArray(arr)) return null;
  for (const item of arr) {
    if (item.id === targetId) return item;
    if (item.c && item.c.length) {
      const found = findWorkItem(item.c, targetId);
      if (found) return found;
    }
  }
  return null;
}

function getItemFieldValue(day, sec, id, field) {
  if (!day) return '';
  if (sec === 'work') {
    const item = findWorkItem(day.work, id);
    return item ? (item.t || '') : '';
  }
  const arr = day[sec];
  if (Array.isArray(arr)) {
    const item = arr.find((it) => it.id === id);
    if (item) return String(item[field] || '');
  }
  return '';
}
