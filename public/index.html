  });

  targetSelect.onchange = () => {
    pwdMsg.textContent = '';
    if (targetSelect.value === 'office') {
      curPwdLabel.textContent = '현재 비밀번호 (관리자 로그인 상태면 생략 가능):';
    } else {
      curPwdLabel.textContent = '현재 비밀번호 (또는 마스터 비밀번호):';
    }
  };

  pwdWrap.append(
    pwdTitle,
    defaultWarnBox,
    el('div', { class: 'hint', text: '화면에서 관리자 또는 사무실 비밀번호를 직접 변경합니다. 저장 시 즉시 반영됩니다.' }),
    targetSelect,
    curPwdLabel,
    curPwdInput,
    el('div', { class: 'hint', text: '새 비밀번호:' }),
    newPwdInput,
    el('div', { class: 'hint', text: '새 비밀번호 확인:' }),
    newPwdConfirm,
    el('div', { class: 'hint', text: '힌트 (로그인 화면에 누구나 볼 수 있습니다):' }),
    hintInput,
    pwdMsg,
    btnChangePwd
  );

  formWrap.append(pwdWrap);
  formWrap.append(errBox);

  // 저장 처리
  const onSave = async () => {
    errBox.textContent = '';
    const siteName = siteInput.value.trim();
    const windLimit = Math.max(0, parseFloat(windInput.value) || 0);
    const rainLimit = Math.max(0, parseFloat(rainInput.value) || 0);

    // 위치: 사용자가 직접 삭제한 경우(null)만 null 전송, 좌표가 유효하지 않으면 생략(undefined)하여 서버 기존값 유지
    let placeToSave = undefined;
    if (selectedPlace === null) {
      placeToSave = null;
    } else if (selectedPlace && typeof selectedPlace === 'object') {
      const lat = Number(selectedPlace.lat);
      const lon = Number(selectedPlace.lon);
      if (!isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
        placeToSave = {
          name: String(selectedPlace.name || '').trim(),
          lat,
          lon,
        };
      }
    }

    try {
      const layoutToSave = {
        cols: modalCols,
        order: modalOrder,
        full: modalFull,
        inner: modalInner,
      };

      const settingsPayload = {
        siteName,
        windLimit,
        rainLimit,
        equipCols: modalCols,
        layout: layoutToSave,
      };
      if (placeToSave !== undefined) {
        settingsPayload.place = placeToSave;
      }

      // 1. settings 저장
      const resSettings = await api('/api/settings', {
        method: 'PUT',
        body: JSON.stringify(settingsPayload),
      });
      S.settings = { ...S.settings, ...(resSettings.settings || {}), layout: layoutToSave, equipCols: modalCols };

      // 2. 수동 날씨 저장 (사용자가 입력/수정한 경우만)
      if (manualTouched) {
        const slotsToSave = [];
        for (const item of manualInputs) {
          const tempVal = item.tempIn.value.trim();
          const windVal = item.windIn.value.trim();
          if (tempVal !== '' || windVal !== '') {
            slotsToSave.push({
              h: item.h,
              w: item.selectW.value,
              temp: parseFloat(tempVal) || 0,
              wind: Math.max(0, parseFloat(windVal) || 0),
            });
          }
        }
        if (slotsToSave.length > 0) {
          await api(`/api/weather/manual/${S.today}`, {
            method: 'PUT',
            body: JSON.stringify(slotsToSave),
          });
        }
      }

      S.layoutDraft = null;
      renderLayoutDraftBar();
      close();
      updateHeaderTitle();
      updateWeather();
      toast('설정이 저장되었습니다');
    } catch (err) {
      if (err.message === 'auth') {
        errBox.textContent = '로그인이 만료되었습니다. 다른 창에서 로그인 후 다시 저장하세요.';
      } else {
        errBox.textContent = (err.body && err.body.error) || '설정 저장 중 오류가 발생했습니다.';
      }
    }
  };

  const close = modal('관리자 설정 (현장명 · 날씨 · 경고)', formWrap, [
    el('button', { class: 'btn primary', text: '저장', onclick: onSave })
  ], true);
}

// ---------- 페이지 종료 시 즉시 저장 (keepalive) ----------
function flushAllKeepalive() {
  if (TV_MODE || !S.token) return;
  for (const dk of Object.keys(dirty)) {
    clearTimeout(timers[dk]);
    clearTimeout(retryTimers[dk]);
    const payload = JSON.stringify(S.days[dk] || emptyDay());
    try {
      fetch('/api/day/' + dk, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token },
        body: payload,
        keepalive: true,
      }).catch(() => {});
    } catch (e) {}
  }
}
if (!TV_MODE) {
  window.addEventListener('pagehide', flushAllKeepalive);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAllKeepalive(); });
}

// ---------- 시계 / 갱신 / 자동 스크롤 ----------
setInterval(() => {
  $('#time').textContent = new Date().toLocaleTimeString('ko-KR', { hour12: false });
}, 1000);

// 날씨 5분 주기 자동 갱신
setInterval(updateWeather, 5 * 60 * 1000);

// 좌하단 접속 정보
let lastConnInfoText = '';
async function updateConnInfo() {
  const elInfo = $('#conn-info');
  try {
    const res = await fetch('/api/info');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const port = data.port || 3000;
    const ips = Array.isArray(data.ips) ? data.ips : [];
    if (!ips.length) {
      lastConnInfoText = '네트워크 연결 없음';
      elInfo.textContent = lastConnInfoText;
      elInfo.className = '';
      return;
    }
    const ipList = ips.map((i) => `http://${i.address}:${port}`).join(' · ');
    const hostPart = data.host ? ` (호스트: http://${data.host}:${port})` : '';
    lastConnInfoText = `접속: ${ipList}${hostPart}`;
    elInfo.textContent = lastConnInfoText;
    elInfo.className = '';
  } catch (err) {
    if (lastConnInfoText) {
      elInfo.textContent = lastConnInfoText + ' (연결 끊김)';
    } else {
      elInfo.textContent = '접속 정보 조회 실패 (연결 끊김)';
    }
    elInfo.className = 'err';
  }
}
updateConnInfo();
setInterval(updateConnInfo, 30000);

window.__IS_DEV = false;
fetch('/api/info').then((r) => r.json()).then((d) => {
  if (d && d.dev) window.__IS_DEV = true;
}).catch(() => {});

function isEditingOrBusy() {
  if (S.modalOpen || activeInlineEdit) return true;
  if (S.layoutDraft !== null || (S.heightsDraft && Object.keys(S.heightsDraft).length > 0)) return true;
  if (document.querySelector('.modal:not(.hidden), .dialog:not(.hidden), #conn-modal:not(.hidden), #pass-modal:not(.hidden), #layout-modal:not(.hidden)')) return true;
  if (S.admin && document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return true;
  return false;
}

function showDevReloadBanner() {
  if (document.getElementById('dev-reload-banner')) return;
  const b = el('div', {
    id: 'dev-reload-banner',
    style: 'position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#f59e0b;color:#0f172a;padding:8px 16px;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.3);z-index:999999;font-weight:700;font-size:14px;display:flex;align-items:center;gap:12px;border:1px solid #d97706;'
  },
    el('span', {}, '⚡ [개발 모드] 파일이 변경되었습니다. 작업 완료 후 새로고침하세요.'),
    el('button', {
      type: 'button',
      style: 'background:#0f172a;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;',
      onclick: () => location.reload()
    }, '지금 새로고침'),
    el('button', {
      type: 'button',
      style: 'background:transparent;color:#0f172a;border:none;padding:2px 6px;cursor:pointer;font-size:16px;line-height:1;',
      onclick: () => b.remove()
    }, '✕')
  );
  document.body.appendChild(b);
}

const es = new EventSource('/events');
es.addEventListener('reload', () => {
  if (!window.__IS_DEV) return;
  if (isEditingOrBusy()) {
    showDevReloadBanner();
  } else {
    location.reload();
  }
});

let sseConnectedOnce = false;
let sseWasDisconnected = false;
es.addEventListener('open', () => {
  if (sseConnectedOnce && sseWasDisconnected && window.__IS_DEV) {
    if (isEditingOrBusy()) {
      showDevReloadBanner();
    } else {
      location.reload();
    }
  }
  sseConnectedOnce = true;
  sseWasDisconnected = false;
});
es.addEventListener('error', () => {
  if (sseConnectedOnce) {
    sseWasDisconnected = true;
  }
});
es.addEventListener('update', async () => {
  if (TV_MODE) {
    fetchAndRenderTvAnnouncements();
  }
  if (S.admin) {
    try {
      const s = await api('/api/state');
      const prevLayoutStr = JSON.stringify(S.settings ? S.settings.layout : null);
      S.settings = s.settings || { siteName: '', equipCols: 1 };
      updateHeaderTitle();
      updateWeather();
      const newLayoutStr = JSON.stringify(S.settings ? S.settings.layout : null);
      if (prevLayoutStr !== newLayoutStr && !S.modalOpen) {
        render();
      }
    } catch {}
  } else if (!S.authExpired) {
    load().catch(() => {});
  }
});

setInterval(async () => { // 연결 끊김 대비 + 자정 날짜 변경 감지
  try {
    const s = await api('/api/state');
    if (s.today !== S.today) {
      let flushOk = true;
      const dirtyKeys = Object.keys(dirty);
      for (const dk of dirtyKeys) {
        clearTimeout(timers[dk]);
        const ok = await saveDay(dk);
        if (!ok) flushOk = false;
      }
      if (flushOk) {
        await load();
      } else {
        setStatus('자정 날짜 변경 감지: 이전 작업 저장 대기 중…', true);
      }
    } else if (!S.admin && !S.authExpired) {
      await load();
    }
  } catch {}
}, 60000);

// ---------- WD-8/WD-9/WD-18 동적 높이 배분 및 다단 페이징 엔진 ----------
function measureSec(sec, innerCols) {
  if (!sec) return { naturalH: 0, minH: 0 };
  const secH = sec.querySelector('.sec-h')?.offsetHeight || 0;
  const tblH = sec.querySelector('.tbl-h')?.offsetHeight || 0;
  const secBody = sec.querySelector('.sec-body');
  const secBorder = (parseFloat(getComputedStyle(sec).borderTopWidth) || 0) +
                    (parseFloat(getComputedStyle(sec).borderBottomWidth) || 0);

  if (!secBody) {
    const baseH = secH + tblH + secBorder;
    return { naturalH: baseH, minH: baseH };
  }

  // 이전에 페이징/다단으로 감싸진 요소를 평탄화하여 순수 item들 측정
  const clones = secBody.querySelectorAll('.tbl-h-clone');
  clones.forEach((c) => c.remove());
  const existingWrappers = secBody.querySelectorAll('.sec-page, .sec-inner-grid, .sec-inner-col, .sec-col-page');
  if (existingWrappers.length > 0) {
    const leafItems = [];
    const collectItems = (parent) => {
      Array.from(parent.children).forEach((child) => {
        if (child.classList.contains('sec-page') || child.classList.contains('sec-inner-grid') || child.classList.contains('sec-inner-col') || child.classList.contains('sec-col-page')) {
          collectItems(child);
        } else {
          leafItems.push(child);
        }
      });
    };
    collectItems(secBody);
    const frag = document.createDocumentFragment();
    leafItems.forEach((it) => frag.appendChild(it));
    secBody.replaceChildren(frag);
  }

  const items = Array.from(secBody.children);
  if (!items.length) {
    const baseH = secH + tblH + secBorder;
    return { naturalH: baseH, minH: baseH };
  }

  let contentH = 0;
  for (let i = 0; i < items.length; i++) {
    contentH += items[i].offsetHeight || 0;
  }

  const secWidth = sec.offsetWidth || 300;
  const maxInner = Math.max(1, Math.min(3, Math.floor(secWidth / 140)));
  const targetInner = (innerCols != null && innerCols > 0) ? Math.min(innerCols, maxInner) : 1;

  const firstH = items[0] ? (items[0].offsetHeight || 0) : 0;
  const innerFactor = targetInner > 1 ? Math.ceil(contentH / targetInner) : contentH;

  return {
    naturalH: Math.ceil(secH + tblH + innerFactor + secBorder + 4),
    minH: Math.ceil(secH + tblH + firstH + secBorder + 4),
  };
}

function allocateHeights(slots, totalAvail) {
  const alloc = {};
  const sumNatural = slots.reduce((acc, s) => acc + s.naturalH, 0);

  // 1. 전체 자연 높이가 사용 가능 높이에 쏙 들어가는 경우:
  // 남는 여유 높이(extra)를 버리지 않고 슬롯들에 배분하여 넉넉한 공간 확보 (아래 빈 공간 남는데 쪼개지는 버그 원천 해결)
  if (sumNatural <= totalAvail) {
    const extra = totalAvail - sumNatural;
    let assigned = 0;
    slots.forEach((s, idx) => {
      if (idx === slots.length - 1) {
        alloc[s.id] = s.naturalH + (extra - assigned);
      } else {
        const add = Math.floor(extra * (s.naturalH / (sumNatural || 1)));
        assigned += add;
        alloc[s.id] = s.naturalH + add;
      }
    });
    return alloc;
  }

  // 2. 가용 높이가 부족한 경우:
  const sumMin = slots.reduce((acc, s) => acc + s.minH, 0);
  if (totalAvail <= sumMin) {
    slots.forEach((s) => {
      alloc[s.id] = Math.max(20, Math.floor(totalAvail * (s.minH / (sumMin || 1))));
    });
    return alloc;
  }

  // 워터필링(Water-filling):
  const sorted = [...slots].sort((a, b) => a.naturalH - b.naturalH);
  let remainingAvail = totalAvail;
  const bigSlots = [];

  for (let i = 0; i < sorted.length; i++) {
    const s = sorted[i];
    const remCount = sorted.length - i;
    const fairShare = remainingAvail / remCount;

    if (s.naturalH <= fairShare) {
      alloc[s.id] = s.naturalH;
      remainingAvail -= s.naturalH;
    } else {
      bigSlots.push(...sorted.slice(i));
      break;
    }
  }

  if (bigSlots.length > 0) {
    const bigSumMin = bigSlots.reduce((acc, s) => acc + s.minH, 0);
    const extraAvail = Math.max(0, remainingAvail - bigSumMin);
    const bigExtraNatural = bigSlots.reduce((acc, s) => acc + Math.max(0, s.naturalH - s.minH), 0);

    let assignedExtraTotal = 0;
    bigSlots.forEach((s, idx) => {
      if (idx === bigSlots.length - 1) {
        const extra = Math.max(0, extraAvail - assignedExtraTotal);
        alloc[s.id] = s.minH + extra;
      } else {
        const ratio = bigExtraNatural > 0 ? Math.max(0, s.naturalH - s.minH) / bigExtraNatural : (1 / bigSlots.length);
        const extra = Math.floor(extraAvail * ratio);
        assignedExtraTotal += extra;
        alloc[s.id] = s.minH + extra;
      }
    });
  }

  return alloc;
}

let activeDrag = null;

if (!window.__resizeDragInited) {
  window.__resizeDragInited = true;

  window.addEventListener('pointermove', (e) => {
    if (!activeDrag) return;
    const deltaY = e.clientY - activeDrag.startY;
    const totalPairH = activeDrag.startTopH + activeDrag.startBottomH;

    let newTopH = Math.max(activeDrag.topMinH, Math.min(totalPairH - activeDrag.bottomMinH, activeDrag.startTopH + deltaY));
    let newBottomH = totalPairH - newTopH;

    let topP = Math.max(5, Math.min(90, Math.round((newTopH / activeDrag.availColH) * 100)));
    let bottomP = Math.max(5, Math.min(90, Math.round((newBottomH / activeDrag.availColH) * 100)));

    const layout = getLayout();
    S.heightsDraft = { ...(S.heightsDraft || layout.heights) };
    activeDrag.topRow.forEach((s) => {
      s.style.height = `${newTopH}px`;
      S.heightsDraft[s.dataset.key] = topP;
    });
    activeDrag.bottomRow.forEach((s) => {
      s.style.height = `${newBottomH}px`;
      S.heightsDraft[s.dataset.key] = bottomP;
    });

    paginateAllSections();
    renderHeightsDraftBar();
  });

  const onGlobalPointerEnd = (e) => {
    if (!activeDrag) return;
    if (activeDrag.handleEl) activeDrag.handleEl.classList.remove('is-dragging');
    const savedCol = activeDrag.col;
    activeDrag = null;
    layoutCol(savedCol);
    paginateAllSections();
    renderHeightsDraftBar();
  };

  window.addEventListener('pointerup', onGlobalPointerEnd);
  window.addEventListener('pointercancel', onGlobalPointerEnd);
}

function layoutCol(col) {
  if (activeDrag && activeDrag.col === col) return;
  const colhead = col.querySelector('.colhead');
  const layout = getLayout();
  const numCols = layout.cols;
  const secs = Array.from(col.querySelectorAll(':scope > .sec'));

  // 기존 인라인 스타일 리셋 및 기존 리사이즈 핸들 제거
  secs.forEach((s) => {
    s.style.height = '';
    s.style.flex = '';
  });
  col.querySelectorAll(':scope > .sec-resize-handle').forEach((h) => h.remove());

  // Grid Row 시뮬레이션
  const rows = [];
  let currentRow = [];
  let currentUsedCols = 0;

  for (const sec of secs) {
    const key = sec.dataset.key;
    const isFull = (numCols === 1) || !!layout.full[key];
    const span = isFull ? numCols : 1;

    if (currentUsedCols + span > numCols && currentRow.length > 0) {
      rows.push(currentRow);
      currentRow = [];
      currentUsedCols = 0;
    }

    currentRow.push(sec);
    currentUsedCols += span;
    if (currentUsedCols >= numCols) {
      rows.push(currentRow);
      currentRow = [];
      currentUsedCols = 0;
    }
  }
  if (currentRow.length > 0) {
    rows.push(currentRow);
  }

  // Row 개수에 비례하는 안전 마진 적용
  const safetyMargin = Math.max(16, rows.length * 3 + 2);
  const availColH = Math.floor(col.clientHeight - (colhead ? colhead.offsetHeight : 0) - safetyMargin);
  if (availColH <= 0) return;

  // Row별 측정 & 슬롯 생성 (WD-18 heights 비율 적용 준비)
  const rowSlots = [];
  rows.forEach((rowSecs, idx) => {
    let rowNaturalH = 0;
    let rowMinH = 0;
    const keys = [];
    rowSecs.forEach((sec) => {
      const key = sec.dataset.key;
      keys.push(key);
      const innerCfg = layout.inner[key] || 1;
      const m = measureSec(sec, innerCfg);
      sec._measuredNaturalH = m.naturalH;
      sec._measuredMinH = m.minH;
      if (m.naturalH > rowNaturalH) rowNaturalH = m.naturalH;
      if (m.minH > rowMinH) rowMinH = m.minH;
    });

    // Row의 heights 비율 확인: Row 내 구역 중 지정된 값이 있는 경우
    let rowPercent = null;
    for (const k of keys) {
      const p = layout.heights && layout.heights[k];
      if (typeof p === 'number' && Number.isFinite(p) && p >= 5 && p <= 90) {
        rowPercent = p;
        break;
      }
    }
    rowSlots.push({ id: idx, naturalH: rowNaturalH, minH: rowMinH, secs: rowSecs, percent: rowPercent, keys });
  });

  // WD-18: 높이 할당 (지정 비율 vs 워터필링 통합)
  const alloc = {};
  const specifiedSlots = rowSlots.filter((s) => s.percent != null);
  const autoSlots = rowSlots.filter((s) => s.percent == null);

  let sumSpecifiedPercent = specifiedSlots.reduce((sum, s) => sum + s.percent, 0);
  const scale = sumSpecifiedPercent > 90 ? (90 / sumSpecifiedPercent) : 1;

  let totalAllocatedSpecified = 0;
  specifiedSlots.forEach((s) => {
    const effectivePercent = s.percent * scale;
    const targetH = Math.max(s.minH, Math.round(availColH * (effectivePercent / 100)));
    alloc[s.id] = targetH;
    totalAllocatedSpecified += targetH;
  });

  if (autoSlots.length > 0) {
    const remainingAvailH = Math.max(autoSlots.reduce((sum, s) => sum + s.minH, 0), availColH - totalAllocatedSpecified);
    const autoAlloc = allocateHeights(autoSlots, remainingAvailH);
    autoSlots.forEach((s) => {
      alloc[s.id] = autoAlloc[s.id];
    });
  }

  // 계산된 높이를 각 구역에 적용
  rowSlots.forEach((slot) => {
    const allocH = alloc[slot.id];
    slot.secs.forEach((sec) => {
      sec.style.height = `${allocH}px`;
      sec.style.flex = 'none';
    });
  });

  // WD-18: 드래그 핸들 배치 (비관리자 화면, 폭 > 800px, 2개 이상 Row일 때)
  if (!S.admin && window.innerWidth > 800 && rows.length > 1) {
    for (let r = 0; r < rows.length - 1; r++) {
      const topRow = rows[r];
      const bottomRow = rows[r + 1];
      const lastSecOfTopRow = topRow[topRow.length - 1];

      const handle = el('div', {
        class: 'sec-resize-handle',
        'data-col-idx': Array.from(col.parentNode.children).indexOf(col),
        'data-top-idx': String(r),
        'data-bottom-idx': String(r + 1),
      });

      // 더블클릭 시 두 Row 비율 초기화 (null 복원)
      handle.addEventListener('dblclick', (e) => {
        e.preventDefault();
        e.stopPropagation();
        S.heightsDraft = { ...(S.heightsDraft || layout.heights) };
        topRow.forEach((s) => { S.heightsDraft[s.dataset.key] = null; });
        bottomRow.forEach((s) => { S.heightsDraft[s.dataset.key] = null; });
        layoutCol(col);
        paginateAllSections();
        renderHeightsDraftBar();
      });

      // 포인터 드래그 시작 (전역 window 이벤트로 부드러운 연속 드래그 지원)
      handle.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handle.classList.add('is-dragging');
        activeDrag = {
          col,
          topRow,
          bottomRow,
          startY: e.clientY,
          startTopH: alloc[r],
          startBottomH: alloc[r + 1],
          topMinH: rowSlots[r].minH,
          bottomMinH: rowSlots[r + 1].minH,
          availColH,
          handleEl: handle,
        };
      });

      lastSecOfTopRow.after(handle);
    }
  }
}

// ---------- WD-18 높이 드래프트 바 및 저장/복원 로직 ----------
function renderHeightsDraftBar() {
  const existing = document.getElementById('height-draft-bar');
  const curLayout = getLayout();
  const rawHeights = S.settings?.layout?.heights || {};

  let isDifferent = false;
  if (S.heightsDraft) {
    for (const k of ['work', 'equip', 'crew', 'material', 'notes']) {
      const curV = S.heightsDraft[k] !== undefined ? S.heightsDraft[k] : null;
      const rawV = rawHeights[k] !== undefined ? rawHeights[k] : null;
      if (curV !== rawV) {
        isDifferent = true;
        break;
      }
    }
  }

  if (!isDifferent || S.admin || window.innerWidth <= 800) {
    if (existing) existing.remove();
    return;
  }

  if (existing) return;

  const bar = el('div', { id: 'height-draft-bar' },
    el('span', { class: 'title', text: '구역 높이 조절됨' }),
    el('div', { class: 'btns' },
      el('button', {
        class: 'btn primary sm',
        text: '저장',
        onclick: saveHeightsFromBar,
      }),
      el('button', {
        class: 'btn sm',
        text: '되돌리기',
        onclick: revertHeightsFromBar,
      }),
      el('button', {
        class: 'btn sm faint',
        text: '자동으로 초기화',
        onclick: resetHeightsToAutoFromBar,
      })
    )
  );
  document.body.appendChild(bar);
}

function removeHeightsDraftBar() {
  const bar = document.getElementById('height-draft-bar');
  if (bar) bar.remove();
}

function revertHeightsFromBar() {
  S.heightsDraft = null;
  removeHeightsDraftBar();
  layoutAndPaginateAll();
  toast('구역 높이가 원래대로 복원되었습니다');
}

function resetHeightsToAutoFromBar() {
  S.heightsDraft = { work: null, equip: null, crew: null, material: null, notes: null };
  layoutAndPaginateAll();
  renderHeightsDraftBar();
  toast('구역 높이가 자동으로 초기화되었습니다 (저장하여 적용)');
}

async function saveHeightsFromBar() {
  const curL = getLayout();
  const heightsToSave = { ...(curL.heights || {}), ...(S.heightsDraft || {}) };

  // 관리자 인증이 이미 있는 경우 즉시 저장
  if (S.admin && S.token) {
    const newLayout = {
      cols: curL.cols,
      order: curL.order,
      full: curL.full,
      inner: curL.inner,
      heights: heightsToSave,
    };
    try {
      const res = await api('/api/settings', {
        method: 'PUT',
        body: JSON.stringify({ layout: newLayout }),
      });
      S.settings = { ...S.settings, ...(res.settings || {}), layout: newLayout };
      S.heightsDraft = null;
      removeHeightsDraftBar();
      layoutAndPaginateAll();
      toast('구역 높이가 저장되었습니다');
    } catch (err) {
      toast('저장 실패: ' + (err.message || '오류'));
    }
    return;
  }

  // 비로그인 상태: 관리자 비밀번호 확인 모달 오픈
  openHeightPasswordModal(heightsToSave);
}

function openHeightPasswordModal(heightsToSave) {
  const pwInput = el('input', {
    type: 'password',
    placeholder: '관리자 비밀번호',
    autocomplete: 'current-password',
    style: 'width:100%;font-size:1rem;',
  });
  const msgEl = el('div', { class: 'msg' });

  const doSave = async () => {
    msgEl.textContent = '';
    const pass = pwInput.value;
    if (!pass) {
      msgEl.textContent = '비밀번호를 입력하세요.';
      return;
    }

    try {
      // 1. 임시 로그인 인증
      const loginRes = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass }),
      });
      if (!loginRes.ok) {
        if (loginRes.status === 429) throw new Error('시도 횟수 초과 — 잠시 후 다시 시도하세요');
        throw new Error('비밀번호가 올바르지 않습니다');
      }
      const loginData = await loginRes.json();
      const tempToken = loginData.token;

      // 2. 설정 저장
      const curL = getLayout();
      const newLayout = {
        cols: curL.cols,
        order: curL.order,
        full: curL.full,
        inner: curL.inner,
        heights: heightsToSave,
      };

      const setRes = await fetch('/api/settings', {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + tempToken,
        },
        body: JSON.stringify({ layout: newLayout }),
      });

      if (!setRes.ok) {
        throw new Error('설정 저장 실패 (HTTP ' + setRes.status + ')');
      }

      // 3. 토큰 정책 준수: TV 모드에서는 토큰을 절대 저장하지 않고 즉시 폐기!
      if (!TV_MODE) {
        S.token = tempToken;
        S.admin = true;
        store.set('tok', tempToken);
      }

      S.settings = { ...S.settings, layout: newLayout };
      S.heightsDraft = null;
      removeHeightsDraftBar();
      closeModal();
      layoutAndPaginateAll();
      toast('구역 높이가 저장되었습니다 (모든 화면 반영)');
    } catch (err) {
      msgEl.textContent = err.message || '저장 실패';
    }
  };

  pwInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doSave();
  });

  const bodyEl = el('div', { style: 'display:flex;flex-direction:column;gap:.6rem;' },
    el('div', { style: 'font-size:.9rem;color:var(--sub);', text: '모든 화면에 적용할 구역 높이를 저장하려면 관리자 비밀번호를 입력하세요.' }),
    pwInput,
    msgEl
  );

  const closeModal = modal('구역 높이 저장 (관리자 인증)', bodyEl, [
    el('button', { class: 'btn primary', text: '저장', onclick: doSave }),
  ]);
  setTimeout(() => pwInput.focus(), 50);
}

function layoutAndPaginateAll() {
  if (S.admin || window.innerWidth <= 800) return;

  const cols = document.querySelectorAll('#main .col');
  cols.forEach((c) => layoutCol(c));

  paginateAllSections();
}

window.addEventListener('resize', () => {
  if (!S.admin && window.innerWidth > 800) {
    layoutAndPaginateAll();
  }
});

function paginateAllSections() {
  if (S.admin || window.innerWidth <= 800) return;

  const layout = getLayout();
  const secs = document.querySelectorAll('#main .sec');

  secs.forEach((sec) => {
    const key = sec.dataset.key;
    const innerConfig = (layout.inner && [0, 1, 2, 3].includes(Number(layout.inner[key]))) ? Number(layout.inner[key]) : 1;
    const secBody = sec.querySelector('.sec-body');
    if (!secBody) return;

    // 기존 배지 제거
    const oldBadge = sec.querySelector('.page-badge, .work-page-badge');
    if (oldBadge) oldBadge.remove();

    // 기존 다단/페이지 평탄화
    const clones = secBody.querySelectorAll('.tbl-h-clone');
    clones.forEach((c) => c.remove());
    const origTblH = sec.querySelector(':scope > .tbl-h');
    if (origTblH) origTblH.style.display = '';
    const origTblHVal = (origTblH && (origTblH.getBoundingClientRect().height || origTblH.offsetHeight)) || 0;
    const existingWrappers = secBody.querySelectorAll('.sec-page, .sec-inner-grid, .sec-inner-col, .sec-col-page');
    if (existingWrappers.length > 0) {
      const leafItems = [];
      const collectItems = (parent) => {
        Array.from(parent.children).forEach((child) => {
          if (child.classList.contains('sec-page') || child.classList.contains('sec-inner-grid') || child.classList.contains('sec-inner-col') || child.classList.contains('sec-col-page')) {
            collectItems(child);
          } else {
            leafItems.push(child);
          }
        });
      };
      collectItems(secBody);
      const frag = document.createDocumentFragment();
      leafItems.forEach((it) => frag.appendChild(it));
      secBody.replaceChildren(frag);
    }

    const items = Array.from(secBody.children);
    if (!items.length || (items.length === 1 && items[0].classList.contains('none'))) {
      sec.removeAttribute('data-paged');
      const origTblH = sec.querySelector(':scope > .tbl-h');
      if (origTblH) origTblH.style.display = '';
      return;
    }

    const availH = secBody.clientHeight;
    if (availH <= 0) return;

    const secWidth = sec.offsetWidth || 300;
    const maxCols = Math.max(1, Math.min(3, Math.floor(secWidth / 140)));

    // 다단 컬럼 수 결정
    let targetInner = 1;
    const isWork = sec.classList.contains('sec-work');
    const isTable = !isWork;

    // 0번 요구: SAFE_PAD = 6 으로 브라우저 서브픽셀/flex 렌더링 오차 및 마지막 행 반쯤 잘림 원천 차단
    const SAFE_PAD = 6;

    // 다단별 실제 렌더링 높이 측정 (폭 축소로 행이 2줄 레이아웃으로 변경되는 현상 반영)
    const measuredCache = {};
    const measureForCols = (numCols) => {
      if (measuredCache[numCols]) return measuredCache[numCols];

      const testGrid = el('div', {
        class: `sec-inner-grid cols-inner-${numCols}`,
        style: 'position:absolute;left:0;top:0;width:100%;visibility:hidden;pointer-events:none;z-index:-999;'
      });
      const testCol = el('div', { class: 'sec-inner-col' });
      const testPage = el('div', { class: 'sec-col-page' });
      testCol.appendChild(testPage);
      testGrid.appendChild(testCol);
      secBody.appendChild(testGrid);

      let measuredTblH = 0;
      if (numCols >= 2 && isTable && origTblH) {
        const hClone = origTblH.cloneNode(true);
        hClone.classList.add('tbl-h-clone');
        hClone.style.display = '';
        testPage.appendChild(hClone);
        measuredTblH = Math.ceil(hClone.getBoundingClientRect().height || hClone.offsetHeight || 0);
      }

      items.forEach((it) => testPage.appendChild(it));
      const heights = items.map((it) => Math.ceil(it.getBoundingClientRect().height || it.offsetHeight || 0));

      items.forEach((it) => secBody.appendChild(it));
      testGrid.remove();

      measuredCache[numCols] = { heights, measuredTblH };
      return measuredCache[numCols];
    };

    // WD-18: 높이에 따른 열 자동 추가 (1단 -> 2단 -> 3단)
    if (innerConfig === 0) { // 자동
      const canFitInCols = (numCols) => {
        const { heights, measuredTblH } = measureForCols(numCols);
        const effH = Math.max(20, (numCols >= 2 && isTable ? availH + origTblHVal - measuredTblH : availH) - SAFE_PAD);
        // 만약 1개 행도 온전히 들어가지 못하는 단수라면 수용 불가
        if (heights.length > 0 && heights[0] > effH) return false;

        let slicesCount = 0;
        let curH = 0;
        let curCount = 0;
        for (let i = 0; i < items.length; i++) {
          const h = heights[i];
          const exceedsMaxWork = isWork && curCount >= WORK_PAGE_SIZE;
          if ((curH + h > effH || exceedsMaxWork) && curCount > 0) {
            slicesCount++;
            curH = h;
            curCount = 1;
          } else {
            curH += h;
            curCount++;
          }
        }
        if (curCount > 0) slicesCount++;
        return slicesCount <= numCols;
      };

      if (canFitInCols(1)) {
        targetInner = 1;
      } else if (maxCols >= 2 && canFitInCols(2)) {
        targetInner = 2;
      } else if (maxCols >= 3 && canFitInCols(3)) {
        targetInner = 3;
      } else {
        // 모든 후보가 1페이지에 안 들어갈 때: 1개 행이라도 담을 수 있는 최대 단수를 선택 (안 되면 1단 폴백)
        targetInner = 1;
        for (let c = maxCols; c >= 1; c--) {
          const { heights, measuredTblH } = measureForCols(c);
          const effH = Math.max(20, (c >= 2 && isTable ? availH + origTblHVal - measuredTblH : availH) - SAFE_PAD);
          if (!heights.length || heights[0] <= effH) {
            targetInner = c;
            break;
          }
        }
      }
    } else {
      targetInner = Math.min(innerConfig, maxCols);
      if (targetInner > 1) {
        const { heights, measuredTblH } = measureForCols(targetInner);
        const effH = Math.max(20, (isTable ? availH + origTblHVal - measuredTblH : availH) - SAFE_PAD);
        if (heights.length > 0 && heights[0] > effH) {
          targetInner = 1;
        }
      }
    }
    if (targetInner < 1) targetInner = 1;

    // 원본 tbl-h 표시 여부: 다단(targetInner >= 2)이고 표 구역이면 원본은 숨기고 단마다 머리글 복사본 삽입
    if (origTblH) {
      origTblH.style.display = (targetInner >= 2 && isTable) ? 'none' : '';
    }

    // targetInner에서의 실제 측정 높이 적용
    const { heights, measuredTblH } = measureForCols(targetInner);
    const colEffectiveAvailH = Math.max(20, (targetInner >= 2 && isTable ? availH + origTblHVal - measuredTblH : availH) - SAFE_PAD);

    // items 패킹 (단 높이 기준 청크 분할)
    const allSlices = [];
    let curSliceItems = [];
    let curSliceHeight = 0;

    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      const h = heights[i];
      const exceedsMaxWork = isWork && curSliceItems.length >= WORK_PAGE_SIZE;
      const exceedsHeight = (curSliceHeight + h > colEffectiveAvailH);

      if ((exceedsHeight || exceedsMaxWork) && curSliceItems.length > 0) {
        allSlices.push(curSliceItems);
        curSliceItems = [item];
        curSliceHeight = h;
      } else {
        curSliceItems.push(item);
        curSliceHeight += h;
      }
    }
    if (curSliceItems.length > 0) {
      allSlices.push(curSliceItems);
    }

    secBody.replaceChildren();

    // 1단 구역인 경우 (기존 동작 100% 보존)
    if (targetInner === 1) {
      const totalPages = allSlices.length;
      if (totalPages <= 1) {
        const pageEl = el('div', { class: 'sec-page cols-inner-1', 'data-page': '0' });
        const colEl = el('div', { class: 'sec-inner-col' });
        (allSlices[0] || []).forEach((it) => colEl.appendChild(it));
        pageEl.appendChild(colEl);
        secBody.appendChild(pageEl);
        sec.removeAttribute('data-paged');
        return;
      }

      sec.setAttribute('data-paged', 'single');
      const curPage = globalTick % totalPages;

      allSlices.forEach((sliceItems, pIdx) => {
        const pageEl = el('div', {
          class: 'sec-page cols-inner-1' + (pIdx !== curPage ? ' is-hidden' : ''),
          'data-page': String(pIdx),
        });
        const colEl = el('div', { class: 'sec-inner-col' });
        sliceItems.forEach((it) => colEl.appendChild(it));
        pageEl.appendChild(colEl);
        secBody.appendChild(pageEl);
      });

      const titleSpan = sec.querySelector('.sec-h > span');
      if (titleSpan) {
        titleSpan.append(el('span', { class: 'badge page-badge', text: `${curPage + 1}/${totalPages}` }));
      }
      return;
    }

    // 2단 이상 다단 구역 (WD-14 단별 독립 순환)
    // allSlices를 targetInner개의 단으로 순차 분배 (단1에 앞쪽, 단2에 뒤쪽...)
    const colSlices = Array.from({ length: targetInner }, () => []);
    let curSliceIdx = 0;
    for (let c = 0; c < targetInner; c++) {
      const remCols = targetInner - c;
      const remSlices = allSlices.length - curSliceIdx;
      const count = Math.ceil(remSlices / remCols);
      colSlices[c] = allSlices.slice(curSliceIdx, curSliceIdx + count);
      curSliceIdx += count;
    }

    // 순환 필요한 단 목록
    const activeCols = [];
    for (let c = 0; c < targetInner; c++) {
      if (colSlices[c].length > 1) {
        activeCols.push(c);
      }
    }

    const gridEl = el('div', { class: `sec-inner-grid cols-inner-${targetInner}` });

    if (activeCols.length === 0) {
      // 모든 단이 1페이지 이하 (순환 불필요)
      sec.removeAttribute('data-paged');
      for (let c = 0; c < targetInner; c++) {
        const colEl = el('div', { class: 'sec-inner-col', 'data-col': String(c) });
        const pageEl = el('div', { class: 'sec-col-page', 'data-page': '0' });
        if (isTable && origTblH) {
          const headerClone = origTblH.cloneNode(true);
          headerClone.classList.add('tbl-h-clone');
          headerClone.style.display = '';
          pageEl.appendChild(headerClone);
        }
        (colSlices[c][0] || []).forEach((it) => pageEl.appendChild(it));
        colEl.appendChild(pageEl);
        gridEl.appendChild(colEl);
      }
      secBody.appendChild(gridEl);
      return;
    }

    // 최소 하나 이상의 단이 다중 페이지 -> 독립 위상 순환 적용
    sec.setAttribute('data-paged', 'multi');

    const curColPages = [];
    const K = activeCols.length;

    for (let c = 0; c < targetInner; c++) {
      const colEl = el('div', { class: 'sec-inner-col', 'data-col': String(c) });
      const pagesForCol = colSlices[c];
      const totalPagesForCol = pagesForCol.length;

      let curColPage = 0;
      if (totalPagesForCol > 1) {
        const k = activeCols.indexOf(c);
        curColPage = Math.floor((globalTick + (K - 1 - k)) / K) % totalPagesForCol;
      }
      curColPages[c] = curColPage;

      if (totalPagesForCol <= 1) {
        const pageEl = el('div', { class: 'sec-col-page', 'data-page': '0' });
        if (isTable && origTblH) {
          const headerClone = origTblH.cloneNode(true);
          headerClone.classList.add('tbl-h-clone');
          headerClone.style.display = '';
          pageEl.appendChild(headerClone);
        }
        (pagesForCol[0] || []).forEach((it) => pageEl.appendChild(it));
        colEl.appendChild(pageEl);
      } else {
        pagesForCol.forEach((sliceItems, pIdx) => {
          const isHidden = (pIdx !== curColPage);
          const pageEl = el('div', {
            class: 'sec-col-page' + (isHidden ? ' is-hidden' : ''),
            'data-page': String(pIdx),
          });
          if (isTable && origTblH) {
            const headerClone = origTblH.cloneNode(true);
            headerClone.classList.add('tbl-h-clone');
            headerClone.style.display = '';
            pageEl.appendChild(headerClone);
          }
          sliceItems.forEach((it) => pageEl.appendChild(it));
          colEl.appendChild(pageEl);
        });
      }
      gridEl.appendChild(colEl);
    }
    secBody.appendChild(gridEl);

    // 배지: 단별 소형 표시 (예: "1단 1/2 · 2단 1/2")
    const titleSpan = sec.querySelector('.sec-h > span');
    if (titleSpan) {
      const badgeText = activeCols.map((c) => `${c + 1}단 ${curColPages[c] + 1}/${colSlices[c].length}`).join(' · ');
      titleSpan.append(el('span', { class: 'badge page-badge', text: badgeText }));
    }
  });
}

function updateGlobalRotation() {
  if (S.admin || S.modalOpen || document.hidden || window.innerWidth <= 800) return;

  // 1. 단일단 구역 순환 (기존 호환)
  const singlePagedSecs = document.querySelectorAll('.sec[data-paged="single"], .sec[data-paged="true"]');
  singlePagedSecs.forEach((sec) => {
    const pages = Array.from(sec.querySelectorAll('.sec-page'));
    const totalPages = pages.length;
    if (totalPages <= 1) return;
    const curPage = globalTick % totalPages;
    pages.forEach((p, idx) => {
      p.classList.toggle('is-hidden', idx !== curPage);
    });
    const badge = sec.querySelector('.page-badge, .work-page-badge');
    if (badge) {
      badge.textContent = `${curPage + 1}/${totalPages}`;
    }
  });

  // 2. 다단 독립 순환 구역 (WD-14)
  const multiPagedSecs = document.querySelectorAll('.sec[data-paged="multi"]');
  multiPagedSecs.forEach((sec) => {
    const colEls = Array.from(sec.querySelectorAll('.sec-inner-col'));
    if (!colEls.length) return;

    // 각 단의 다중 페이지 여부 확인
    const colPageLists = colEls.map((cEl) => Array.from(cEl.querySelectorAll('.sec-col-page')));
    const activeCols = [];
    colPageLists.forEach((pList, cIdx) => {
      if (pList.length > 1) activeCols.push(cIdx);
    });

    if (activeCols.length === 0) return;

    const K = activeCols.length;
    const curColPages = [];

    activeCols.forEach((cIdx) => {
      const pList = colPageLists[cIdx];
      const totalPagesForCol = pList.length;
      const k = activeCols.indexOf(cIdx);
      const curColPage = Math.floor((globalTick + (K - 1 - k)) / K) % totalPagesForCol;
      curColPages[cIdx] = curColPage;

      pList.forEach((p, pIdx) => {
        p.classList.toggle('is-hidden', pIdx !== curColPage);
      });
    });

    // 배지 갱신
    const badge = sec.querySelector('.page-badge, .work-page-badge');
    if (badge) {
      badge.textContent = activeCols.map((c) => `${c + 1}단 ${curColPages[c] + 1}/${colPageLists[c].length}`).join(' · ');
    }
  });
}

function startGlobalRotation() {
  if (globalRotateTimer) clearInterval(globalRotateTimer);
  if (!TV_MODE) return;
  globalRotateTimer = setInterval(() => {
    if (TV_MODE && !S.admin && !S.modalOpen && !document.hidden && window.innerWidth > 800) {
      globalTick++;
      workTick = globalTick;
      updateGlobalRotation();
    }
  }, ROTATE_MS);
  window.__workTimer = globalRotateTimer;
  window.__globalTimer = globalRotateTimer;
}
startGlobalRotation();

// WD-10 / WD-15: 모니터용(/tv) 우상단 전체화면/창화면 + 테마 전환 버튼 (마우스 이동 시 3초간 표시)
function initTvControls() {
  if (!TV_MODE) return;
  if (document.getElementById('tv-controls')) return;

  const wrap = el('div', { id: 'tv-controls' });
  const viewControl = createViewModeControl(true);
  const themeBtn = createThemeToggleBtn(true);
  const fsBtn = el('button', {
    id: 'tv-fullscreen-btn',
    type: 'button',
    title: '전체 화면 전환 (F11 / Esc)'
  });

  const updateText = () => {
    const isFs = !!document.fullscreenElement;
    fsBtn.textContent = isFs ? '⛶ 창 화면 (Esc / F11)' : '⛶ 전체 화면 (F11)';
    fsBtn.title = isFs ? '창 화면으로 전환하거나 Esc / F11 키를 누르세요' : '전체 화면으로 전환하거나 F11 키를 누르세요';
  };
  updateText();

  fsBtn.onclick = async () => {
    try {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          await document.exitFullscreen();
        }
      }
    } catch (e) {
      toast('전체화면 전환: F11 또는 Esc 키를 사용하세요');
    }
    updateText();
  };

  document.addEventListener('fullscreenchange', updateText);

  const editBtn = el('button', {
    id: 'tv-edit-btn',
    type: 'button',
    title: '관리자 로그인 후 편집 화면으로 이동',
    text: '✎ 편집',
    onclick: () => { store.set('fromTv', '1'); location.href = '/?admin=1'; },
  });

  const statusEl = el('span', { id: 'tv-status', text: '' });
  const refreshStatus = async () => {
    try {
      const info = await api('/api/info');
      const fmt = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
      const bk = info.backup && info.backup.latest ? `백업 ${info.backup.latest.slice(5).replace('-', '/')}${info.backup.today ? '' : ' (오늘 없음)'}` : '백업 없음';
      statusEl.textContent = info.stale ? `⚠ 서버 재시작 필요 · 시작 ${fmt(info.startedAt)}` : `서버 시작 ${fmt(info.startedAt)} · ${bk}`;
      statusEl.classList.toggle('stale', !!info.stale);
    } catch {
      statusEl.textContent = '서버 응답 없음';
      statusEl.classList.add('stale');
    }
  };
  refreshStatus();
  setInterval(refreshStatus, 60000);

  let hideTimer = null;
  const showControls = () => {
    wrap.classList.add('is-visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      wrap.classList.remove('is-visible');
    }, 3000);
  };

  document.addEventListener('mousemove', showControls, { passive: true });
  document.addEventListener('touchstart', showControls, { passive: true });

  wrap.append(statusEl, viewControl, themeBtn, editBtn, fsBtn);
  document.body.appendChild(wrap);
}
initTvControls();
initInlineEditHandler();

let resizeTimer = null;
window.addEventListener('resize', () => {
  if (S.admin || window.innerWidth <= 800) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    render();
  }, 100);
});

let pause = 0, atBottom = false;
setInterval(() => { // 큰 화면에서 내용이 넘치면 천천히 스크롤 (조회 모드 데스크톱은 고정 레이아웃이므로 스크롤 정지)
  if (S.admin || S.modalOpen || document.hidden) return;
  if (window.innerWidth > 800) return; // WD-8 고정 레이아웃: 데스크톱/TV 스크롤 정지
  const max = Math.ceil(document.documentElement.scrollHeight - innerHeight);
  if (max <= 4) return;
  if (pause > 0) { pause--; return; }
  if (atBottom) { scrollTo(0, 0); atBottom = false; pause = 100; return; }
  scrollBy(0, 1);
  if (Math.ceil(scrollY) >= max - 2) { atBottom = true; pause = 100; }
}, 40);

(async () => {
  if (TV_MODE) {
    S.token = null;
    S.admin = false;
    S.authExpired = false;
  } else {
    const t = store.get('tok');
    if (t) {
      S.token = t;
      try {
        await api('/api/me');
        S.admin = true;
      } catch {
        S.token = null;
        S.admin = false;
        S.authExpired = false;
      }
    }
  }
  try {
    await load();
    if (TV_MODE) fetchAndRenderTvAnnouncements();
    if (!TV_MODE && !S.admin && new URLSearchParams(location.search).get('admin') === '1') {
      history.replaceState(null, '', location.pathname);
      openLogin();
    }
    if (!TV_MODE) {
      checkDefaultPassword();
      initIdleReturnToTv();
    }
  } catch {
    $('#main').replaceChildren(el('div', { class: 'empty', text: '서버에 연결할 수 없습니다' }));
  }
})();
</script>
</body>
