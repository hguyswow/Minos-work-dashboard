function startInlineEdit(targetCell) {
  if (TV_MODE || S.admin) return;
  if (activeInlineEdit) {
    if (activeInlineEdit.cell === targetCell) return;
    commitInlineEdit(true);
  }

  const dk = targetCell.getAttribute('data-dk');
  const sec = targetCell.getAttribute('data-sec');
  const id = targetCell.getAttribute('data-id');
  const field = targetCell.getAttribute('data-field');
  if (!dk || !sec || !id || !field) return;

  const currentDay = S.days[dk] || emptyDay();
  const originalVal = getItemFieldValue(currentDay, sec, id, field);

  if (window.getSelection) {
    try { window.getSelection().removeAllRanges(); } catch {}
  }

  const inputEl = el('input', {
    class: 'inline-edit-input',
    type: 'text',
    value: originalVal,
  });

  const dlMap = {
    'equip.loc': 'dl-loc',
    'crew.job': 'dl-crew-job',
    'material.kind': 'dl-material-kind',
    'material.spec': 'dl-material-spec',
    'material.unit': 'dl-material-unit',
    'material.use': 'dl-use',
  };
  const dlId = dlMap[`${sec}.${field}`];
  if (dlId && document.getElementById(dlId)) {
    inputEl.setAttribute('list', dlId);
  }

  const prevChildren = Array.from(targetCell.childNodes);
  targetCell.replaceChildren(inputEl);

  const editState = {
    cell: targetCell,
    dk,
    sec,
    id,
    field,
    originalVal,
    prevChildren,
    inputEl,
    committed: false,
  };
  activeInlineEdit = editState;

  inputEl.addEventListener('keydown', (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      commitInlineEdit(true);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      commitInlineEdit(false);
    }
  });

  const openTime = Date.now();
  inputEl.addEventListener('blur', () => {
    setTimeout(() => {
      if (Date.now() - openTime < 450) return;
      if (activeInlineEdit === editState && !editState.committed && !S.modalOpen) {
        commitInlineEdit(true);
      }
    }, 200);
  });

  const ensureFocus = () => {
    if (activeInlineEdit === editState && !editState.committed && inputEl.isConnected) {
      inputEl.focus();
      inputEl.select();
    }
  };
  ensureFocus();
  setTimeout(ensureFocus, 50);
  setTimeout(ensureFocus, 120);
}

async function commitInlineEdit(shouldSave) {
  const cur = activeInlineEdit;
  if (!cur || cur.committed) return;

  if (!shouldSave) {
    cur.committed = true;
    cur.cell.replaceChildren(...cur.prevChildren);
    activeInlineEdit = null;
    if (pendingRenderAfterInline) {
      pendingRenderAfterInline = false;
      render();
    }
    return;
  }

  const newVal = cur.inputEl.value.trim();
  if (newVal === cur.originalVal) {
    cur.committed = true;
    cur.cell.replaceChildren(...cur.prevChildren);
    activeInlineEdit = null;
    if (pendingRenderAfterInline) {
      pendingRenderAfterInline = false;
      render();
    }
    return;
  }

  cur.committed = true;
  cur.inputEl.disabled = true;

  try {
    const stateRes = await api('/api/state');
    let freshDay = null;
    if (cur.dk === stateRes.today) {
      freshDay = normDay(stateRes.todayData);
    } else if (cur.dk === stateRes.prev) {
      freshDay = normDay(stateRes.prevData);
    } else {
      try {
        const hist = await api('/api/history/day/' + cur.dk);
        freshDay = normDay(hist && hist.day);
      } catch {}
    }

    if (!freshDay) {
      throw new Error('일 데이터를 불러올 수 없습니다.');
    }

    let targetItem = null;
    if (cur.sec === 'work') {
      targetItem = findWorkItem(freshDay.work, cur.id);
    } else if (Array.isArray(freshDay[cur.sec])) {
      targetItem = freshDay[cur.sec].find((it) => it.id === cur.id);
    }

    if (!targetItem) {
      toast('항목이 이미 삭제되었습니다');
      activeInlineEdit = null;
      await load();
      return;
    }

    targetItem[cur.field] = newVal;

    await api('/api/day/' + cur.dk, {
      method: 'PUT',
      body: JSON.stringify(freshDay),
    });

    S.days[cur.dk] = freshDay;
    lastSavedHash[cur.dk] = JSON.stringify(freshDay);
    activeInlineEdit = null;
    pendingRenderAfterInline = false;
    render();
    toast('저장되었습니다');
  } catch (err) {
    cur.committed = false;
    cur.inputEl.disabled = false;
    if (err.message === 'auth') {
      openInlineAuthModal(() => {
        commitInlineEdit(true);
      }, () => {
        cur.committed = true;
        cur.cell.replaceChildren(...cur.prevChildren);
        activeInlineEdit = null;
      });
      return;
    }
    toast('저장 실패: ' + ((err.body && err.body.error) || err.message || ''));
    setTimeout(() => {
      try {
        if (cur.inputEl && cur.inputEl.isConnected) {
          cur.inputEl.focus();
          cur.inputEl.select();
        }
      } catch {}
    }, 50);
  }
}

      const id = targetCell.getAttribute('data-id');
      const field = targetCell.getAttribute('data-field');
      openInlineAuthModal(() => {
        const freshCell = document.querySelector(`[data-dk="${dk}"][data-sec="${sec}"][data-id="${id}"][data-field="${field}"]`);
        if (freshCell) {
          startInlineEdit(freshCell);
        }
      });
    } else {
      startInlineEdit(targetCell);
    }
  });
}

function copyPrev() {
  if (!S.prev) return toast('복사할 이전 기록이 없습니다');
  const cats = [['work', '작업현황'], ['equip', '장비'], ['crew', '인원'], ['material', '자재'], ['notes', '특이사항']];
  const boxes = cats.map(([k, label]) => {
    const cb = el('input', { type: 'checkbox' });
    cb.checked = true;
    return { k, label, cb };
  });
  const list = el('div', { class: 'copy-prev-list' },
    ...boxes.map((b) => el('label', {}, b.cb, document.createTextNode(b.label)))
  );
  const close = modal('어제 내용 → 오늘 복사', el('div', {},
    el('div', { class: 'hint', text: '복사할 항목을 고르세요. 선택한 항목의 오늘 내용은 어제 내용으로 바뀝니다.' }),
    list
  ), [el('button', {
    class: 'btn primary',
    text: '복사',
    onclick: () => {
      const picked = boxes.filter((b) => b.cb.checked).map((b) => b.k);
      if (!picked.length) return toast('복사할 항목을 선택하세요');
      const today = S.days[S.today];
      const overwrite = picked.some((k) => today && Array.isArray(today[k]) && today[k].length > 0);
      if (overwrite && !confirm('선택한 항목의 오늘 기존 내용이 사라집니다. 계속할까요?')) return;
      const src = cloneDay(S.days[S.prev]);
      const dst = today || emptyDay();
      for (const k of picked) dst[k] = src[k];
      S.days[S.today] = dst;
      touch(S.today);
      close();
    },
  })]);
}

// 모니터(/tv)의 [편집]으로 들어온 경우, 5분간 조작이 없으면 로그아웃하고 /tv로 복귀
const IDLE_RETURN_MS = 5 * 60 * 1000;
let idleReturnTimer = null;
function initIdleReturnToTv() {
  if (store.get('fromTv') !== '1' || idleReturnTimer !== null) return;
  const arm = () => {
    clearTimeout(idleReturnTimer);
    idleReturnTimer = setTimeout(() => {
      const busy = Object.keys(dirty).length > 0 || activeInlineEdit || S.modalOpen;
      if (busy) return arm();
      store.set('tok', null);
      store.set('fromTv', null);
      location.href = '/tv';
    }, IDLE_RETURN_MS);
  };
  for (const ev of ['mousemove', 'keydown', 'click', 'touchstart', 'input']) {
    document.addEventListener(ev, arm, { passive: true });
  }
  arm();
}

function preparePrintValues() {
  cleanupPrintValues();
  const mainEl = document.getElementById('main');
  if (!mainEl) return;
  const fields = mainEl.querySelectorAll('input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]), textarea, select');
  fields.forEach((f) => {
    if (f.closest('.acts') || f.closest('#datalists')) return;
    let val = '';
    if (f.tagName === 'SELECT') {
      val = (f.selectedOptions && f.selectedOptions[0]) ? f.selectedOptions[0].text : (f.value || '');
    } else {
      val = f.value || '';
    }
    const span = document.createElement('span');
    span.className = 'print-val';
    span.textContent = val;
    f.insertAdjacentElement('afterend', span);
  });
}

function cleanupPrintValues() {
  document.querySelectorAll('.print-val').forEach((el) => el.remove());
}

function printReport() {
  preparePrintValues();
  document.body.classList.add('printing');
  window.print();
}
window.addEventListener('beforeprint', preparePrintValues);
window.addEventListener('afterprint', () => {
  cleanupPrintValues();
  document.body.classList.remove('printing');
});

// ---------- WD-22: /tv 공고 오버레이 ----------
let activeAnnounceItems = [];
let activeAnnounceTimer = null;
let serverTimeOffset = 0;

async function fetchAndRenderTvAnnouncements() {
  if (!TV_MODE) return;
  try {
    const res = await fetch('/api/announce/active');
    if (!res.ok) return;
    const data = await res.json();
    serverTimeOffset = (typeof data.now === 'number' ? data.now : Date.now()) - Date.now();
    activeAnnounceItems = Array.isArray(data.items) ? data.items : [];
    renderTvOverlay();
    scheduleNextAnnounceTick();
  } catch (err) {
    // 공고 수신 실패 시 조용히 무시
  }
}

function renderTvOverlay() {
  if (!TV_MODE) return;
  const overlay = document.getElementById('tv-ann-overlay');
  if (!activeAnnounceItems || activeAnnounceItems.length === 0) {
    if (overlay) overlay.remove();
    return;
  }

  const now = Date.now() + serverTimeOffset;
  const earliestUntil = Math.min(...activeAnnounceItems.map((it) => it.until));
  const remainSec = Math.max(0, Math.ceil((earliestUntil - now) / 1000));
  const remainMin = Math.ceil(remainSec / 60);
  const footerText = remainMin > 1 ? `공고 표출 중 (약 ${remainMin}분 남음)` : '공고 표출 중 (곧 종료)';

  // 이미 오버레이와 카드가 존재하면 내용만 갱신 (위치/애니메이션 보존)
  const card = overlay ? overlay.querySelector('.tv-ann-card') : null;
  if (overlay && card) {
    const list = card.querySelector('.tv-ann-list');
    const footer = card.querySelector('.tv-ann-footer');
    if (list) {
      list.replaceChildren();
      for (const item of activeAnnounceItems) {
        list.append(el('div', { class: 'tv-ann-msg', text: item.text || '' }));
      }
    }
    if (footer) {
      footer.textContent = footerText;
    }
    return;
  }

  // 처음 생성
  const newOverlay = overlay || el('div', { id: 'tv-ann-overlay' });
  newOverlay.replaceChildren();

  const list = el('div', { class: 'tv-ann-list' });
  for (const item of activeAnnounceItems) {
    list.append(el('div', { class: 'tv-ann-msg', text: item.text || '' }));
  }

  const newCard = el('div', { class: 'tv-ann-card' },
    el('div', { class: 'tv-ann-badge', text: '알림 사항' }),
    list,
    el('div', { class: 'tv-ann-footer', text: footerText })
  );

  const driftY = el('div', { class: 'tv-ann-drift-y' }, newCard);
  const driftX = el('div', { class: 'tv-ann-drift-x' }, driftY);
  newOverlay.append(driftX);

  if (!overlay) {
    document.body.append(newOverlay);
  }
}

function scheduleNextAnnounceTick() {
  if (activeAnnounceTimer) {
    clearTimeout(activeAnnounceTimer);
    activeAnnounceTimer = null;
  }
  if (!TV_MODE || !activeAnnounceItems || activeAnnounceItems.length === 0) return;

  activeAnnounceTimer = setTimeout(() => {
    const now = Date.now() + serverTimeOffset;
    const expired = activeAnnounceItems.some((it) => it.until <= now);
    if (expired) {
      fetchAndRenderTvAnnouncements();
    } else {
      renderTvOverlay();
      scheduleNextAnnounceTick();
    }
  }, 5000);
}

        style: 'padding:.15rem .5rem;font-size:.8rem',
        text: '공고 해제',

          }
        },
      });
      quickActiveBox.append(infoSpan, btnCancel);
    } else {
      quickActiveBox.style.display = 'none';
    }
  };

  btnShowQuick.onclick = async () => {
    const text = quickTxt.value.trim();
    if (!text) return alert('공고 내용을 입력하세요.');
    const durMin = parseInt(quickDur.value, 10) || 10;
    try {
      const res = await api('/api/announce', {
        method: 'POST',
        body: JSON.stringify({ text, durMin }),
      });
      activeAnn = res.announce;
      quickTxt.value = '';
      renderQuickSec();
      toast('즉시 공고가 TV에 표시되었습니다.');
    } catch (e) {
      toast('즉시 공고 등록 실패: ' + (e.message || ''));
    }
  };

  const renderCalendar = () => {
    navTitle.textContent = `${viewYear}년 ${viewMonth + 1}월`;
    calGrid.replaceChildren();

    const daysOfWeek = [
      { t: '일', c: 'sun' }, { t: '월' }, { t: '화' }, { t: '수' }, { t: '목' }, { t: '금' }, { t: '토', c: 'sat' }
    ];
    for (const d of daysOfWeek) {

    }

    const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();
    const prevLastDate = new Date(viewYear, viewMonth, 0).getDate();

    for (let i = firstDay - 1; i >= 0; i--) {
      const pDate = prevLastDate - i;

        el('div', { class: 'cal-num', text: String(pDate) })
      );
      calGrid.append(cell);

      const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isToday = (dateStr === todayStr);
      const isSelected = (dateStr === selectedDate);
      const list = plansData[dateStr] || [];
      const hasPlan = list.length > 0;
      const hasAnn = list.some((p) => p.announce === true);

      const dotsEl = el('div', { class: 'cal-dots' });
      if (hasAnn) {
        dotsEl.append(el('span', { class: 'dot-ann', title: '공고 일정 포함' }));
      } else if (hasPlan) {
        dotsEl.append(el('span', { class: 'dot-plan', title: '일정 있음' }));

      const cell = el('div', {
        class: 'cal-cell' + (isToday ? ' today' : '') + (isSelected ? ' selected' : ''),

          selectedDate = dateStr;
          renderCalendar();
          renderDayPlans();

      },
        el('div', { class: 'cal-num', text: String(d) }),
        dotsEl
      );
      calGrid.append(cell);
    }

    const totalCells = firstDay + lastDate;
    const remaining = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= remaining; i++) {
      const cell = el('div', { class: 'cal-cell other-month' },
        el('div', { class: 'cal-num', text: String(i) })
      );
      calGrid.append(cell);
    }
  };

  const renderDayPlans = () => {
    dayTitle.textContent = `${selectedDate} 일정`;
    dayList.replaceChildren();

    const list = plansData[selectedDate] || [];
    if (list.length === 0) {
      dayList.append(el('div', { class: 'hint', style: 'padding:.8rem 0;text-align:center', text: '등록된 일정이 없습니다. 우측 상단의 [+ 일정 추가]를 눌러보세요.' }));

        type: 'text',
        class: 'plan-txt',
        placeholder: '일정 내용 (최대 200자)',

          p.text = e.target.value;
          isDirty = true;
          renderCalendar();
        },
      });

      const chkAnn = el('input', {
        type: 'checkbox',
      });
      chkAnn.checked = !!p.announce;

      const timeInput = el('input', {
        type: 'time',
        class: 'plan-time',
        value: p.time || '09:00',
        onchange: (e) => {

      });

        max: '720',
        value: String(p.durMin || 10),
        oninput: (e) => {
          p.durMin = parseInt(e.target.value, 10) || 10;
          isDirty = true;
        },
      });
      durInput.disabled = !p.announce;

      chkAnn.onchange = (e) => {
        p.announce = e.target.checked;
        timeInput.disabled = !p.announce;
        durInput.disabled = !p.announce;
        isDirty = true;
        renderCalendar();
      };

        type: 'button',
        class: 'ib del',
        text: '✕',
        title: '일정 삭제',

        durInput,

  btnAdd.onclick = () => {
    plansData[selectedDate] = plansData[selectedDate] || [];
    if (plansData[selectedDate].length >= 20) {
      return alert('한 날짜에 최대 20개까지 등록할 수 있습니다.');
    }
    const newId = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10);
    plansData[selectedDate].push({
      id: newId,
      text: '',
      announce: false,
      time: '09:00',
      durMin: 10,
    });
    isDirty = true;
    renderCalendar();
    renderDayPlans();
  };

  btnPrev.onclick = () => {
    viewMonth--;
    if (viewMonth < 0) {
      viewMonth = 11;
      viewYear--;
    }
    renderCalendar();
  };

  btnNext.onclick = () => {
    viewMonth++;
    if (viewMonth > 11) {

  };

  btnToday.onclick = () => {
    const now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    selectedDate = todayStr;
    renderCalendar();
    renderDayPlans();
  };

  renderCalendar();
  renderDayPlans();
  renderQuickSec();

  const onSave = async () => {

        method: 'PUT',
        body: JSON.stringify({ plans: plansData }),
      });
      isDirty = false;

    el('button', { class: 'btn primary', text: '저장', onclick: onSave }),
  ], true, () => {

      return confirm('저장하지 않은 변경사항이 있습니다. 닫으시겠습니까?');

    return true;
  });

  if (modalEl) modalEl.classList.add('wide-plans');

  const calLegend = el('div', { style: 'font-size:.78rem;color:var(--sub);margin-top:.4rem;display:flex;align-items:center;gap:.4rem;' },
    el('span', { class: 'dot-history' }),
    el('span', { text: '기록이 있는 날짜' })
  );
  calWrap.append(calNav, calGrid, calLegend);

  const historyContent = el('div', { class: 'history-content' });
  const layoutWrap = el('div', { class: 'history-layout' }, calWrap, historyContent);

  // 2. 달력 렌더링 함수
  const renderCalendar = () => {
    calNavTitle.textContent = `${viewYear}년 ${viewMonth + 1}월`;
    calGrid.replaceChildren();

    const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];
    daysOfWeek.forEach((d, idx) => {
      const cls = idx === 0 ? 'cal-th sun' : (idx === 6 ? 'cal-th sat' : 'cal-th');
      calGrid.append(el('div', { class: cls, text: d }));
    });

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();
    const prevLastDate = new Date(viewYear, viewMonth, 0).getDate();

    for (let i = firstDay - 1; i >= 0; i--) {
      const pDate = prevLastDate - i;
      calGrid.append(el('div', { class: 'cal-cell other-month' }, el('div', { class: 'cal-num', text: String(pDate) })));
    }

    for (let d = 1; d <= lastDate; d++) {
      const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isToday = (dateStr === todayStr);
      const isSelected = (dateStr === selectedDate);
      const summary = datesMap.get(dateStr);
      const hasData = !!summary && (summary.work > 0 || summary.equip > 0 || summary.crew > 0 || summary.material > 0 || summary.notes > 0);

      const dotsEl = el('div', { class: 'cal-dots' });
      if (hasData) {
        dotsEl.append(el('span', { class: 'dot-history', title: '기록 있음' }));
      }

      const cell = el('div', {
        class: 'cal-cell' + (isToday ? ' today' : '') + (isSelected ? ' selected' : '') + (hasData ? ' has-data' : ''),
        onclick: () => {
          selectedDate = dateStr;
          renderCalendar();
          renderHistoryDay(dateStr);
        },
      },
        el('div', { class: 'cal-num', text: String(d) }),
        dotsEl
      );
      calGrid.append(cell);
    }

    const totalCells = firstDay + lastDate;
    const remaining = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= remaining; i++) {
      calGrid.append(el('div', { class: 'cal-cell other-month' }, el('div', { class: 'cal-num', text: String(i) })));
    }
  };

  btnPrev.onclick = () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  };
  btnNext.onclick = () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
  };
  btnToday.onclick = () => {
    const d = new Date();
    viewYear = d.getFullYear();
    viewMonth = d.getMonth();
    selectedDate = todayStr;
    renderCalendar();
    renderHistoryDay(selectedDate);
  };

  // 3. 우측 날짜별 기록 렌더링 함수
  const renderHistoryDay = async (dateStr) => {
    historyContent.replaceChildren(el('div', { class: 'history-empty', text: '기록을 불러오는 중…' }));

    let dayData = cachedDays.get(dateStr);
    if (!dayData) {
      try {
        const res = await fetch(`/api/history/day/${encodeURIComponent(dateStr)}`);
        if (res.status === 404) {
          cachedDays.set(dateStr, { notFound: true });
          dayData = { notFound: true };
        } else if (!res.ok) {
          throw new Error('HTTP ' + res.status);
        } else {
          const json = await res.json();
          dayData = json.day || emptyDay();
          cachedDays.set(dateStr, dayData);
        }
      } catch (err) {
        historyContent.replaceChildren(el('div', { class: 'history-empty msg', text: '기록 조회 중 오류가 발생했습니다: ' + err.message }));
        return;
      }
    }

    if (dayData.notFound) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dayOfWeek = '일월화수목금토'[new Date(y, m - 1, d).getDay()];
      historyContent.replaceChildren(
        el('div', { class: 'history-header-meta' },
          el('div', { class: 'date-title', text: `${dateStr} (${dayOfWeek})` }),
          el('div', { class: 'counts-summary', text: '기록 없음' })
        ),
        el('div', { class: 'history-empty', text: '해당 날짜에 저장된 작업 기록이 없습니다.' })
      );
      return;
    }

    const [y, m, d] = dateStr.split('-').map(Number);
    const dayOfWeek = '일월화수목금토'[new Date(y, m - 1, d).getDay()];
    const workList = Array.isArray(dayData.work) ? dayData.work : [];
    const equipList = Array.isArray(dayData.equip) ? dayData.equip : [];
    const crewList = Array.isArray(dayData.crew) ? dayData.crew : [];
    const materialList = Array.isArray(dayData.material) ? dayData.material : [];
    const notesList = Array.isArray(dayData.notes) ? dayData.notes : [];

    historyContent.replaceChildren();

    // 상단 메타 바
    const metaBar = el('div', { class: 'history-header-meta' },
      el('div', { class: 'date-title', text: `${dateStr} (${dayOfWeek}) 작업 현황 기록` }),
      el('div', { class: 'counts-summary', text: `작업 ${workList.length}건 · 장비 ${equipList.length}대 · 인원 ${crewList.length}개 직종 · 자재 ${materialList.length}건` })
    );
    historyContent.append(metaBar);

    // ① 작업현황
    const workSec = el('div', { class: 'history-sec sec-work' },
      el('div', { class: 'history-sec-h' },
        el('span', { text: '작업현황' }),
        el('span', { class: 'badge', text: `${workList.length}건` })
      )
    );
    if (!workList.length) {
      workSec.append(el('div', { class: 'history-empty', text: '작업현황 기록이 없습니다.' }));
    } else {
      const workTbl = el('table', { class: 'history-tbl' },
        el('thead', {},
          el('tr', {},
            el('th', { style: 'width:3.2rem;text-align:center', text: '순번' }),
            el('th', { text: '작업 내용 / 위치' })
          )
        )
      );
      const tbody = el('tbody');
      let topNum = 0;
      const walk = (arr, depth) => {
        let kIdx = 1;
        arr.forEach((item) => {
          if (!item.t && (!item.c || !item.c.length)) return;
          const numStr = (depth === 0) ? String(++topNum) : workNum(depth, kIdx++);
          const tdContent = el('td', { style: `padding-left:${0.5 + depth * 1.2}rem` });
          if (depth > 0) {
            tdContent.append(el('span', { style: 'color:var(--sub);margin-right:.3rem;', text: '└' }));
          }
          tdContent.append(document.createTextNode(item.t || ''));
          tbody.append(el('tr', {},
            el('td', { class: 'center', text: numStr }),
            tdContent
          ));
          if (item.c && item.c.length) walk(item.c, depth + 1);
        });
      };
      walk(workList, 0);
      workTbl.append(tbody);
      workSec.append(workTbl);
    }
    historyContent.append(workSec);

    // ② 장비
    const equipSec = el('div', { class: 'history-sec sec-equip' },
      el('div', { class: 'history-sec-h' },
        el('span', { text: '장비' }),
        el('span', { class: 'badge', text: `${equipList.length}대` })
      )
    );
    if (!equipList.length) {
      equipSec.append(el('div', { class: 'history-empty', text: '투입된 장비가 없습니다.' }));
    } else {
      const equipTbl = el('table', { class: 'history-tbl' },
        el('thead', {},
          el('tr', {},
            el('th', { style: 'width:3.2rem;text-align:center', text: '순번' }),
            el('th', { text: '장비명' }),
            el('th', { text: '수량' }),
            el('th', { text: '규격' }),
            el('th', { text: '작업위치' })
          )
        )
      );
      const tbody = el('tbody');
      equipList.forEach((e, idx) => {
        const isDirect = !!e.direct;
        tbody.append(el('tr', {},
          el('td', { class: 'center', text: String(idx + 1) }),
          el('td', { class: isDirect ? 'is-direct' : '', text: e.name || '' }),
          el('td', { class: isDirect ? 'is-direct' : '', text: e.qty || '' }),
          el('td', { class: isDirect ? 'is-direct' : '', text: e.spec || '' }),
          el('td', { class: isDirect ? 'is-direct' : '', text: e.loc || '' })
        ));
      });
      equipTbl.append(tbody);
      equipSec.append(equipTbl);
    }
    historyContent.append(equipSec);

    // ③ 인원투입
    const crewSec = el('div', { class: 'history-sec sec-crew' },
      el('div', { class: 'history-sec-h' },
        el('span', { text: '인원투입' }),
        el('span', { class: 'badge', text: `${crewList.length}개 직종` })
      )
    );
    if (!crewList.length) {
      crewSec.append(el('div', { class: 'history-empty', text: '투입된 인원이 없습니다.' }));
    } else {
      let directSum = 0;
      let totalSum = 0;
      const crewTbl = el('table', { class: 'history-tbl' },
        el('thead', {},
          el('tr', {},
            el('th', { style: 'width:3.2rem;text-align:center', text: '순번' }),
            el('th', { text: '직종' }),
            el('th', { style: 'width:5rem;text-align:right', text: '인원(명)' }),
            el('th', { text: '작업위치' })
          )
        )
      );
      const tbody = el('tbody');
      crewList.forEach((c, idx) => {
        const isDirect = !!c.direct;
        const cnt = parseFloat(c.count) || 0;
        totalSum += cnt;
        if (isDirect) directSum += cnt;
        tbody.append(el('tr', {},
          el('td', { class: 'center', text: String(idx + 1) }),
          el('td', { class: isDirect ? 'is-direct' : '', text: c.job || '' }),
          el('td', { class: 'right' + (isDirect ? ' is-direct' : ''), text: c.count || '' }),
          el('td', { class: isDirect ? 'is-direct' : '', text: c.loc || '' })
        ));
      });
      crewTbl.append(tbody);
      crewSec.append(crewTbl);
      crewSec.append(el('div', { class: 'history-tbl-footer', text: `총 인원: ${totalSum}명 (직영 ${directSum}명 / 기타 ${totalSum - directSum}명)` }));
    }
    historyContent.append(crewSec);

    // ④ 자재
    const matSec = el('div', { class: 'history-sec sec-material' },
      el('div', { class: 'history-sec-h' },
        el('span', { text: '자재' }),
        el('span', { class: 'badge', text: `${materialList.length}건` })
      )
    );
    if (!materialList.length) {
      matSec.append(el('div', { class: 'history-empty', text: '반입/사용된 자재가 없습니다.' }));
    } else {
      const matTbl = el('table', { class: 'history-tbl' },
        el('thead', {},
          el('tr', {},
            el('th', { style: 'width:3.2rem;text-align:center', text: '순번' }),
            el('th', { text: '품명' }),
            el('th', { text: '규격' }),
            el('th', { style: 'width:4.5rem;text-align:right', text: '수량' }),
            el('th', { style: 'width:3.5rem;text-align:center', text: '단위' }),
            el('th', { text: '사용처' })
          )
        )
      );
      const tbody = el('tbody');
      materialList.forEach((m, idx) => {
        const isDirect = !!m.direct;
        tbody.append(el('tr', {},
          el('td', { class: 'center', text: String(idx + 1) }),
          el('td', { class: isDirect ? 'is-direct' : '', text: m.kind || '' }),
          el('td', { class: isDirect ? 'is-direct' : '', text: m.spec || '' }),
          el('td', { class: 'right' + (isDirect ? ' is-direct' : ''), text: m.qty || '' }),
          el('td', { class: 'center' + (isDirect ? ' is-direct' : ''), text: m.unit || '' }),
          el('td', { class: isDirect ? 'is-direct' : '', text: m.use || '' })
        ));
      });
      matTbl.append(tbody);
      matSec.append(matTbl);
    }
    historyContent.append(matSec);

    // ⑤ 특이사항
    const notesSec = el('div', { class: 'history-sec sec-notes' },
      el('div', { class: 'history-sec-h' },
        el('span', { text: '특이사항' }),
        el('span', { class: 'badge', text: `${notesList.length}건` })
      )
    );
    if (!notesList.length) {
      notesSec.append(el('div', { class: 'history-empty', text: '기록된 특이사항이 없습니다.' }));
    } else {
      const notesTbl = el('table', { class: 'history-tbl' },
        el('thead', {},
          el('tr', {},
            el('th', { style: 'width:3.2rem;text-align:center', text: '순번' }),
            el('th', { text: '내용' })
          )
        )
      );
      const tbody = el('tbody');
      notesList.forEach((n, idx) => {
        tbody.append(el('tr', {},
          el('td', { class: 'center', text: String(idx + 1) }),
          el('td', { text: n.t || '' })
        ));
      });
      notesTbl.append(tbody);
      notesSec.append(notesTbl);
    }
    historyContent.append(notesSec);
  };

  // 4. 모달 인스턴스 띄우기
  const close = modal('지난 날짜 작업 현황', layoutWrap, [], true);
  const modalEl = document.querySelector('.ov:last-child .md');
  if (modalEl) modalEl.classList.add('wide-history');

  // 5. 날짜 인덱스 API 호출 및 초기 렌더링
  try {
    const datesRes = await fetch('/api/history/dates');
    if (datesRes.ok) {
      const datesJson = await datesRes.json();
      if (Array.isArray(datesJson.dates)) {
        datesJson.dates.forEach((d) => {
          if (d.date) datesMap.set(d.date, d);
        });
      }
    }
  } catch (err) {
    console.error('이력 날짜 목록 조회 실패:', err);
  }

  // 선택된 날짜에 데이터가 없으면 데이터가 있는 최근 날짜로 이동
  if (!datesMap.has(selectedDate) && datesMap.size > 0) {
    const sortedDates = Array.from(datesMap.keys()).sort();
    const candidate = sortedDates.filter((d) => d <= todayStr).pop() || sortedDates[sortedDates.length - 1];
    if (candidate) {
      selectedDate = candidate;
      const [cy, cm] = candidate.split('-').map(Number);
      viewYear = cy;
      viewMonth = cm - 1;
    }
  }

  renderCalendar();
  renderHistoryDay(selectedDate);
}

// ---------- 관리자 설정 모달 (WD-2-C) ----------
async function openSettingsModal() {
  if (TV_MODE) return;
  // 1. 현재 날씨 데이터 및 위치 좌표 가져오기
  let curPlace = S.settings && S.settings.place ? { ...S.settings.place } : null;
  let curManualSlots = null;
  try {
    const wRes = await fetch('/api/weather');
    if (wRes.ok) {
      const wData = await wRes.json();
      if (wData.place) curPlace = { ...wData.place };
      if (wData.source === 'manual' && Array.isArray(wData.slots)) {
        curManualSlots = wData.slots;
      }
    }
  } catch {}

  const formWrap = el('div', { class: 'body-scroll' });
  const errBox = el('div', { class: 'msg' });

  // ① 현장/회사명
  const siteInput = el('input', { type: 'text', value: S.settings.siteName || '', placeholder: '예: OO지구 신축공사' });
  formWrap.append(el('div', { class: 'form-row' },
    el('label', { text: '① 현장 / 회사명' }),
    siteInput,
    el('div', { class: 'hint', text: '헤더 중앙 타이틀 좌측에 [현장명] 형식으로 표시됩니다.' })
  ));

  // ② 날씨 위치
  let selectedPlace = curPlace ? { ...curPlace } : null;
  const placeLabel = el('div', { style: 'font-weight:700;color:var(--ink);margin-bottom:.2rem', text: selectedPlace ? `${selectedPlace.name} (위도: ${selectedPlace.lat}, 경도: ${selectedPlace.lon})` : '지정된 위치 없음' });

  const geoQuery = el('input', { type: 'text', placeholder: '도시명 검색 (예: 서울, 부산, 수원)', style: 'flex:1' });
  const geoResultBox = el('div', { class: 'geo-results', style: 'display:none' });
  const geoMsg = el('div', { class: 'msg', style: 'min-height:0' });

  const KOREA_CITIES = {
    '서울': 'Seoul', '부산': 'Busan', '대구': 'Daegu', '인천': 'Incheon',
    '광주': 'Gwangju', '대전': 'Daejeon', '울산': 'Ulsan', '세종': 'Sejong',
    '수원': 'Suwon', '성남': 'Seongnam', '고양': 'Goyang', '용인': 'Yongin',
    '부천': 'Bucheon', '안산': 'Ansan', '청주': 'Cheongju', '천안': 'Cheonan',
    '전주': 'Jeonju', '포항': 'Pohang', '창원': 'Changwon', '제주': 'Jeju'
  };

  const onSearchGeo = async () => {
    let q = geoQuery.value.trim();
    if (!q) return;
    const mapped = KOREA_CITIES[q] || KOREA_CITIES[q.replace(/시$|특별시$|광역시$/, '')];
    if (mapped) q = mapped;
    geoMsg.textContent = '검색 중…';
    geoResultBox.style.display = 'none';
    geoResultBox.replaceChildren();
    try {
      const r = await api(`/api/geocode?q=${encodeURIComponent(q)}`);
      geoMsg.textContent = '';
      if (!Array.isArray(r) || !r.length) {
        geoMsg.textContent = '검색 결과가 없습니다.';
        return;
      }
      geoResultBox.style.display = 'flex';
      for (const item of r) {
        const itemBtn = el('div', { class: 'geo-item' },
          el('b', { text: item.name }),
          el('span', { style: 'font-size:.78rem;color:var(--sub);margin-left:.4rem', text: `${item.admin || ''} (${Number(item.lat).toFixed(4)}, ${Number(item.lon).toFixed(4)})` })
        );
        itemBtn.onclick = () => {
          selectedPlace = {
            name: item.name + (item.admin ? ` ${item.admin}` : ''),
            lat: item.lat,
            lon: item.lon,
          };
          placeLabel.textContent = `${selectedPlace.name} (위도: ${selectedPlace.lat}, 경도: ${selectedPlace.lon})`;
          latInput.value = selectedPlace.lat;
          lonInput.value = selectedPlace.lon;
          manualNameInput.value = selectedPlace.name;
          geoResultBox.style.display = 'none';
        };
        geoResultBox.append(itemBtn);
      }
    } catch (e) {
      geoMsg.textContent = '도시 검색 실패 — 인터넷 연결을 확인하거나 위도·경도를 직접 입력하세요';
    }
  };
  geoQuery.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); onSearchGeo(); } });

  const manualNameInput = el('input', { type: 'text', placeholder: '위치명', value: selectedPlace ? selectedPlace.name : '', style: 'flex:1.2' });
  const latInput = el('input', { type: 'text', placeholder: '위도 (예: 37.5665)', value: selectedPlace ? selectedPlace.lat : '', style: 'flex:1' });
  const lonInput = el('input', { type: 'text', placeholder: '경도 (예: 126.9780)', value: selectedPlace ? selectedPlace.lon : '', style: 'flex:1' });

  const onManualCoordsChange = () => {
    const lat = parseFloat(latInput.value);
    const lon = parseFloat(lonInput.value);
    const name = manualNameInput.value.trim();
    if (!isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
      selectedPlace = { name: name || '직접입력', lat, lon };
      placeLabel.textContent = `${selectedPlace.name} (위도: ${selectedPlace.lat}, 경도: ${selectedPlace.lon})`;
    }
  };
  latInput.addEventListener('input', onManualCoordsChange);
  lonInput.addEventListener('input', onManualCoordsChange);
  manualNameInput.addEventListener('input', onManualCoordsChange);

  formWrap.append(el('div', { class: 'form-row' },
    el('label', { text: '② 날씨 위치' }),
    placeLabel,
    el('div', { style: 'display:flex;gap:.3rem' },
      geoQuery,
      el('button', { class: 'btn', text: '검색', onclick: onSearchGeo })
    ),
    geoMsg,
    geoResultBox,
    el('div', { class: 'hint', style: 'margin-top:.3rem', text: '또는 위도·경도 직접 입력:' }),
    el('div', { style: 'display:flex;gap:.3rem' },
      manualNameInput,
      latInput,
      lonInput
    )
  ));

  // ③ 경고 기준
  const curWind = (typeof S.settings.windLimit === 'number' && S.settings.windLimit >= 0) ? S.settings.windLimit : 10;
  const curRain = (typeof S.settings.rainLimit === 'number' && S.settings.rainLimit >= 0) ? S.settings.rainLimit : 1;
  const windInput = el('input', { type: 'text', value: String(curWind), style: 'flex:1', inputmode: 'numeric' });
  const rainInput = el('input', { type: 'text', value: String(curRain), style: 'flex:1', inputmode: 'numeric' });

  formWrap.append(el('div', { class: 'form-row' },
    el('label', { text: '③ 경고 기준' }),
    el('div', { style: 'display:flex;gap:.8rem;align-items:center' },
      el('div', { style: 'display:flex;align-items:center;gap:.3rem;flex:1' },

  // ⑤ 구역 배치 · 열 수 · 내부 다단 (WD-9)

    el('option', { value: '2', ...(modalCols === 2 ? { selected: '' } : {}) }, '2열 (최대 2개 구역 가로 나란히)'),

  );

          class: 'ib',
          title: '아래로',

  // ⑥ 비밀번호 관리 (WD-29)

  })();

  const targetSelect = el('select', { id: 'pwd-target-select', style: 'font-size:.9rem;padding:.3rem .5rem;' },

  const newPwdInput = el('input', { id: 'input-new-pwd', type: 'password', autocomplete: 'new-password', placeholder: '새 비밀번호 (4~32자, 공백 제외)' });
  const newPwdConfirm = el('input', { id: 'input-confirm-pwd', type: 'password', autocomplete: 'new-password', placeholder: '새 비밀번호 확인' });
  const hintInput = el('input', { id: 'input-pwd-hint', type: 'text', maxlength: '60', placeholder: '비밀번호 힌트 (선택, 비밀번호 자체는 쓰지 마세요)' });
  const pwdMsg = el('div', { id: 'pwd-change-msg', class: 'msg', style: 'min-height:0;' });

  const btnChangePwd = el('button', {
    id: 'btn-change-pwd',
    type: 'button',
    class: 'btn',
    style: 'align-self:flex-start;margin-top:.3rem;',
    text: '비밀번호 변경',
    onclick: async () => {
      pwdMsg.textContent = '';
      pwdMsg.style.color = 'var(--danger)';
      const target = targetSelect.value;
      const curVal = curPwdInput.value;
      const newVal = newPwdInput.value;
      const confirmVal = newPwdConfirm.value;
      const hintVal = hintInput.value.trim();

      if (!newVal || newVal.length < 4 || newVal.length > 32) {
        pwdMsg.textContent = '새 비밀번호는 4자 이상 32자 이하여야 합니다.';
        return;
      }
      if (/\s/.test(newVal)) {
        pwdMsg.textContent = '새 비밀번호에 공백을 포함할 수 없습니다.';
        return;
      }
      if (newVal !== confirmVal) {
        pwdMsg.textContent = '새 비밀번호와 확인 입력이 일치하지 않습니다.';
        return;
      }

      try {
        const payload = {
          target,
          newPassword: newVal,
          hint: hintVal,
          current: curVal,
          master: curVal,
        };
        const r = await api('/api/auth/change', {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        if (r && r.ok) {
          pwdMsg.style.color = 'var(--accent)';
          pwdMsg.textContent = '✓ 비밀번호가 성공적으로 변경되었습니다.';
          curPwdInput.value = '';
          newPwdInput.value = '';
          newPwdConfirm.value = '';
          hintInput.value = '';
          defaultWarnBox.style.display = 'none';
          toast('비밀번호가 변경되었습니다.');
        }
      } catch (err) {
        pwdMsg.style.color = 'var(--danger)';
        pwdMsg.textContent = (err.body && err.body.error) || '비밀번호 변경 실패';
      }
